# Slow Burn — Codemagic cloud build → TestFlight (Capacitor iOS)
# Mirrors the ChordLoop pipeline. Automatic code signing: the App Store Connect
# API key (integration "ChordLoopAPIKey") CREATES the distribution certificate +
# provisioning profile on first run. Same Apple team, so the same key works here.
workflows:
  ios-testflight:
    name: Slow Burn iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    # --- Auto-build on push to main -----------------------------------------
    # A push to main starts this workflow automatically: no browser, no "Start
    # build" click. See PLAYBOOK.md "Shipping without the browser".
    # ONE-TIME per app in the Codemagic UI: the repo needs a webhook registered
    # (app -> Settings -> Webhooks -> "Add webhook"). Apps configured via
    # codemagic.yaml, or connected over SSH/HTTPS rather than the GitHub App, do
    # NOT get one automatically -- without it this block is inert and nothing
    # breaks, builds just never self-start.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      # A newer push supersedes an in-flight build of the same branch.
      cancel_previous_builds: true
    integrations:
      app_store_connect: ChordLoopAPIKey   # existing API key in your Codemagic team
    environment:
      ios_signing:
        provisioning_profiles:
          - SlowBurn_AppStore_SharedDist
        certificates:
          - JB_Shared_Distribution
      vars:
        BUNDLE_ID: "com.jonathanbiles.slowburn"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm install
      # The privacy promise is a build gate, not a habit. If anything readable
      # reaches the pairing wire, or the encrypted handshake stops resisting a
      # hostile relay, the build stops here. See PRIVACY.md.
      - name: Privacy + end-to-end encryption tests
        script: npm test
      - name: Add + sync iOS platform (Capacitor)
        script: |
          [ -d ios ] || npx cap add ios
          npx cap sync ios
      - name: Embed the Slow Burn app icon (replace Capacitor default)
        script: |
          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          if [ -f appicon-1024.png ]; then
            rm -rf "$ICONSET"; mkdir -p "$ICONSET"
            cp appicon-1024.png "$ICONSET/AppIcon-1024.png"
            cat > "$ICONSET/Contents.json" <<'JSON'
          { "images": [ { "filename": "AppIcon-1024.png", "idiom": "universal", "platform": "ios", "size": "1024x1024" } ], "info": { "author": "xcode", "version": 1 } }
          JSON
            echo "Embedded Slow Burn app icon:"; ls -la "$ICONSET"
          else
            echo "No appicon-1024.png found — using Capacitor default icon."
          fi
      # --- GUIDELINE 4 (iPad) --------------------------------------------------
      # Slow Burn is an iPhone-only app. It is a TWO-PHONE pairing program: two
      # people each hold their own phone. On iPad the layout is correct but
      # more than half the screen is empty, and this app has already taken one
      # Guideline 4 rejection on iPad. Shipping iPhone-only removes the surface
      # entirely rather than defending a screen nobody will use.
      # Capacitor generates the project fresh on every build, so this has to be
      # forced AFTER `cap add ios` rather than committed.
      - name: Force iPhone-only (TARGETED_DEVICE_FAMILY = 1)
        script: |
          PBX=ios/App/App.xcodeproj/project.pbxproj
          # Capacitor emits "1,2" (iPhone + iPad); rewrite every occurrence.
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2";/TARGETED_DEVICE_FAMILY = "1";/g' "$PBX"
          sed -i '' 's/TARGETED_DEVICE_FAMILY = 1,2;/TARGETED_DEVICE_FAMILY = "1";/g' "$PBX"
          if grep -q 'TARGETED_DEVICE_FAMILY = "1,2"' "$PBX" || grep -q 'TARGETED_DEVICE_FAMILY = 1,2' "$PBX"; then
            echo "FAILED: project still targets iPad."; exit 1
          fi
          echo "TARGETED_DEVICE_FAMILY now:"; grep -c 'TARGETED_DEVICE_FAMILY = "1";' "$PBX"
      - name: Set build number + export-compliance flag
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "6787719986" 2>/dev/null || echo 0)
          NEXT=$(( LATEST + 1 ))
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEXT" "$PLIST"
          # EXPORT COMPLIANCE — reviewed 2 Aug 2026, after the app gained real
          # end-to-end encryption (ECDH P-256 + AES-256-GCM).
          # The app implements no cryptography of its own: it calls WebCrypto,
          # which is part of iOS (WebKit), and uses it only to secure the app's
          # own pairing link. Determination on record from Jonathan: this is
          # standard/exempt encryption, so the answer stays "false" and the
          # per-build export-compliance prompt stays skipped.
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          echo "CFBundleVersion set to $NEXT (previous TestFlight latest: $LATEST); ITSAppUsesNonExemptEncryption=false"
      - name: Set up code signing — apply the stored profile + the ONE shared cert (no mint, no revoke)
        script: |
          security find-identity -v -p codesigning || true
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" || true
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

        # --- REVIEW-SUBMIT TOGGLE — deliberately OFF ---------------------------
        # As written, every green build goes to TestFlight and stops there.
        # Uncommenting submit_to_app_store makes EVERY subsequent green build
        # submit itself for App Store review, so flip it on with intent and flip
        # it back off after the release.
        # Prerequisites in App Store Connect, or the submit step fails the build:
        #   - screenshots for every required device size
        #   - description, keywords, promotional text, support + marketing URLs
        #   - privacy policy URL and the App Privacy answers
        #   - age rating, category, and export-compliance answers
        #   - a "What's New" note for this version string
        # See PLAYBOOK.md "Submitting for review without the browser".
        # submit_to_app_store: true
        # release_type: MANUAL      # MANUAL | AFTER_APPROVAL | SCHEDULED
