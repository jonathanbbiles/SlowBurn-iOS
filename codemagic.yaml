# Slow Burn — Codemagic cloud build → TestFlight (Capacitor iOS)
# Mirrors the ChordLoop pipeline. Automatic code signing: the App Store Connect
# API key (integration "ChordLoopAPIKey") CREATES the distribution certificate +
# provisioning profile on first run. Same Apple team, so the same key works here.
workflows:
  ios-testflight:
    name: Slow Burn iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    # --- Auto-build on push to main -----------------------------------------
    # A push to main starts this workflow automatically: no browser, no "Start
    # build" click. See PLAYBOOK.md "Shipping without the browser".
    # ONE-TIME per app in the Codemagic UI: the repo needs a webhook registered
    # (app -> Settings -> Webhooks -> "Add webhook"). Apps configured via
    # codemagic.yaml, or connected over SSH/HTTPS rather than the GitHub App, do
    # NOT get one automatically -- without it this block is inert and nothing
    # breaks, builds just never self-start.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      # A newer push supersedes an in-flight build of the same branch.
      cancel_previous_builds: true
    integrations:
      app_store_connect: ChordLoopAPIKey   # existing API key in your Codemagic team
    environment:
      ios_signing:
        provisioning_profiles:
          - SlowBurn_AppStore_SharedDist
        certificates:
          - JB_Shared_Distribution
      vars:
        BUNDLE_ID: "com.jonathanbiles.slowburn"
        # Apple's numeric App ID. An identifier, not a secret.
        ASC_APP_ID: "6787719986"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm install
      # The privacy promise is a build gate, not a habit. If anything readable
      # reaches the pairing wire, or the encrypted handshake stops resisting a
      # hostile relay, the build stops here. See PRIVACY.md.
      - name: Privacy + end-to-end encryption tests
        script: npm test
      - name: Add + sync iOS platform (Capacitor)
        script: |
          [ -d ios ] || npx cap add ios
          npx cap sync ios
      # --- WHY THIS STEP EXISTS -------------------------------------------------
      # cordova-plugin-purchase is what makes the tip jar real. If `cap sync` does not
      # pick it up, the app still builds, still runs, and still passes every test —
      # it just quietly falls back to the "no purchasable product" Support card. That
      # is safe for the user (no dead button) and fatal for the review: the in-app
      # purchase would sit in the submission with no way for a reviewer to buy it. So
      # the plugin's absence has to be visible HERE, not discovered in a rejection.
      #
      # This app is on Capacitor 8, which generates an **SPM** project — there is no
      # Podfile, and a guard that greps Podfile.lock fails 100% of builds (the first
      # run of this step did exactly that). Capacitor 8 handles a Cordova plugin by
      # writing it a shim package under ios/capacitor-cordova-ios-plugins/sources/ and
      # adding it to the app's Package.swift.
      #
      # ONLY what is listed in that Package.swift is in the IPA. `npx cap ls` lists
      # plugins it has merely discovered, and `cap sync` DROPS an SPM-incompatible
      # plugin with a warning and carries on — which is how three Permission releases
      # shipped without their native plugin. So this reads the generated manifest, and
      # it checks the plugin appears BOTH as a package dependency and as a product of
      # the app target: listed as a dependency but never linked is the silent failure.
      - name: Verify the purchase plugin actually reached the iOS project
        script: |
          set -e
          PKG=ios/App/CapApp-SPM/Package.swift
          SRC=ios/capacitor-cordova-ios-plugins/sources/CordovaPluginPurchase
          echo "--- generated Package.swift ---"; cat "$PKG"
          [ -f "$PKG" ] || { echo "ERROR: $PKG was not generated — cap sync did not run."; exit 1; }
          grep -q 'name: "CordovaPluginPurchase", path:' "$PKG" \
            || { echo "ERROR: CordovaPluginPurchase is not a package dependency in Package.swift."; \
                 echo "cap sync dropped the plugin. The tip jar would never load a product, and the"; \
                 echo "in-app purchase in review would be unbuyable."; exit 1; }
          grep -q '.product(name: "CordovaPluginPurchase"' "$PKG" \
            || { echo "ERROR: CordovaPluginPurchase is declared but NOT linked into the app target."; exit 1; }
          [ -f "$SRC/InAppPurchase.m" ] \
            || { echo "ERROR: the plugin's StoreKit implementation is missing from $SRC."; exit 1; }
          grep -q 'linkedFramework("StoreKit")' "$SRC/Package.swift" \
            || { echo "ERROR: the plugin package does not link StoreKit."; exit 1; }
          echo "ok  cordova-plugin-purchase is linked into the iOS project (SPM), StoreKit framework included"

      - name: Embed the Slow Burn app icon (replace Capacitor default)
        script: |
          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          if [ -f appicon-1024.png ]; then
            rm -rf "$ICONSET"; mkdir -p "$ICONSET"
            cp appicon-1024.png "$ICONSET/AppIcon-1024.png"
            cat > "$ICONSET/Contents.json" <<'JSON'
          { "images": [ { "filename": "AppIcon-1024.png", "idiom": "universal", "platform": "ios", "size": "1024x1024" } ], "info": { "author": "xcode", "version": 1 } }
          JSON
            echo "Embedded Slow Burn app icon:"; ls -la "$ICONSET"
          else
            echo "No appicon-1024.png found — using Capacitor default icon."
          fi
      # --- GUIDELINE 4 (iPad) --------------------------------------------------
      # Slow Burn is an iPhone-only app. It is a TWO-PHONE pairing program: two
      # people each hold their own phone. On iPad the layout is correct but
      # more than half the screen is empty, and this app has already taken one
      # Guideline 4 rejection on iPad. Shipping iPhone-only removes the surface
      # entirely rather than defending a screen nobody will use.
      # Capacitor generates the project fresh on every build, so this has to be
      # forced AFTER `cap add ios` rather than committed.
      - name: Force iPhone-only (TARGETED_DEVICE_FAMILY = 1)
        script: |
          PBX=ios/App/App.xcodeproj/project.pbxproj
          # Capacitor emits "1,2" (iPhone + iPad); rewrite every occurrence.
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2";/TARGETED_DEVICE_FAMILY = "1";/g' "$PBX"
          sed -i '' 's/TARGETED_DEVICE_FAMILY = 1,2;/TARGETED_DEVICE_FAMILY = "1";/g' "$PBX"
          if grep -q 'TARGETED_DEVICE_FAMILY = "1,2"' "$PBX" || grep -q 'TARGETED_DEVICE_FAMILY = 1,2' "$PBX"; then
            echo "FAILED: project still targets iPad."; exit 1
          fi
          echo "TARGETED_DEVICE_FAMILY now:"; grep -c 'TARGETED_DEVICE_FAMILY = "1";' "$PBX"
      # --- CAMERA (pair-code scanner) ------------------------------------------
      # iOS KILLS the app instantly if it touches the camera with no usage
      # description — this is not optional, and Capacitor does not add it.
      # The string is what the user reads in the permission dialog, so it says
      # exactly what the camera is for and nothing more.
      - name: Add NSCameraUsageDescription (pair-code scanner)
        script: |
          PLIST=ios/App/App/Info.plist
          DESC="Slow Burn uses the camera only to read your partner's pair code from their screen. The image stays on your phone — nothing is recorded, saved or sent."
          # plutil, not PlistBuddy: the string contains an apostrophe and an em
          # dash, which PlistBuddy's -c parser rejects ("Unclosed Quotes").
          # plutil takes the value as its own argument, so it just works.
          plutil -replace NSCameraUsageDescription -string "$DESC" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$PLIST" \
            || { echo "FAILED: NSCameraUsageDescription not set — the scanner would crash the app."; exit 1; }
      # --- MARKETING VERSION ---------------------------------------------------
      # 1.0 was REJECTED (2.1(b), business-model question), not approved. The
      # normal fix-and-resubmit flow is to upload a new BUILD against the same
      # version record, so this stays 1.0 and only CFBundleVersion increments.
      # Shipping 1.1 instead would force a new version record in App Store
      # Connect for no benefit. Change this only when 1.0 is actually released.
      - name: Set marketing version (1.0 — resubmission build)
        script: |
          PLIST=ios/App/App/Info.plist
          plutil -replace CFBundleShortVersionString -string "1.0" "$PLIST"
          echo "CFBundleShortVersionString = $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
      - name: Set build number + export-compliance flag
        script: |
          set -euo pipefail
          # MONOTONIC TIMESTAMP BUILD NUMBER — same scheme as moodie-ios.
          #
          # This step used to ask App Store Connect for the latest TestFlight
          # build number and add one. That scheme is broken, and it cost three
          # failed builds on 2026-08-14 to prove it. Apple's rule is that
          # CFBundleVersion must be strictly higher than the highest value EVER
          # uploaded against the version record — but
          # `get-latest-testflight-build-number` reports the latest build still
          # AVAILABLE in TestFlight, which can read lower once builds expire or
          # are removed. Slow Burn's 1.0 record had already seen build 10, so
          # latest+1 landed at or below 10 and Apple refused the upload:
          #
          #   "iris-code": "ENTITY_ERROR.ATTRIBUTE.INVALID.DUPLICATE"
          #   "bundle version must be higher than the previously uploaded version"
          #   "previousBundleVersion": "10"
          #
          # The only visible symptom was "Failed to publish App.ipa to App Store
          # Connect" at the end of an otherwise green build.
          #
          # A UTC timestamp is always a large integer (2.0e11), so it is always
          # strictly greater than any hand-numbered build this app will ever
          # have had, and it always increases build-over-build without asking
          # anyone. No network round-trip, nothing to authenticate, and no way
          # for this class of collision to come back. Do not replace this with
          # a query-and-increment scheme.
          BUILD_NUMBER="$(date -u +%Y%m%d%H%M)"
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NUMBER" "$PLIST"
          # EXPORT COMPLIANCE — reviewed 2 Aug 2026, after the app gained real
          # end-to-end encryption (ECDH P-256 + AES-256-GCM).
          # The app implements no cryptography of its own: it calls WebCrypto,
          # which is part of iOS (WebKit), and uses it only to secure the app's
          # own pairing link. Determination on record from Jonathan: this is
          # standard/exempt encryption, so the answer stays "false" and the
          # per-build export-compliance prompt stays skipped.
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          echo "CFBundleShortVersionString = $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          echo "CFBundleVersion            = $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")"
          echo "ITSAppUsesNonExemptEncryption=false"
      - name: Set up code signing — apply the stored profile + the ONE shared cert (no mint, no revoke)
        script: |
          security find-identity -v -p codesigning || true
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" || true
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

        # submit_to_app_store is deliberately NOT used here. It would submit on
        # EVERY green build, and it cannot supply screenshots or release notes.
        # The review submit is the opt-in post-publish step below instead.

      # --- Post-publish: submit for App Store review (opt-in, per build) --------
      # Runs AFTER the block above has uploaded the signed IPA, so a build exists
      # for the submission to attach to.
      #
      # This does nothing unless SUBMIT_FOR_REVIEW=true, and that variable is
      # deliberately NOT defined anywhere in this repo. It can only arrive as a
      # per-build override from the Codemagic REST API:
      #     scripts/cm-build.sh --submit --watch
      # So an ordinary build — and any push — stops at TestFlight by construction,
      # rather than by remembering to keep a toggle switched off.
      scripts:
        - name: Submit for App Store review (only when explicitly requested)
          script: bash scripts/asc-submit.sh

  # ---------------------------------------------------------------------------
  # On-demand, READ-ONLY check that the App Store Connect key stored in Codemagic
  # can actually drive a submission. Submits nothing, signs nothing, builds nothing.
  # Deliberately has no `triggering:` block, so a push can never run it.
  #     scripts/cm-build.sh -w asc-auth-check --watch
  # ---------------------------------------------------------------------------
  asc-auth-check:
    name: Slow Burn — ASC auth check (read-only)
    instance_type: mac_mini_m2
    max_build_duration: 15
    integrations:
      app_store_connect: ChordLoopAPIKey
    environment:
      vars:
        ASC_APP_ID: "6787719986"
      xcode: latest
    scripts:
      - name: Prove the ASC key authenticates for a submission (submits nothing)
        script: bash scripts/asc-auth-check.sh

  # ---------------------------------------------------------------------------
  # On-demand, READ-ONLY dump of everything App Store Connect holds for this app:
  # every version and its state, the full listing copy, the open review submission
  # and WHAT IS IN IT, and every in-app purchase with the exact reason it is or is
  # not submittable.
  #
  # It answers, from the source of truth, the question the repo cannot: whether the
  # store listing and the in-app purchases agree with each other and with what Apple
  # has been told. Every call is a GET; there is no write path in asc-inspect.py.
  #
  # No `triggering:` block, so a push can never run it.
  #     scripts/cm-build.sh -w asc-inspect --watch
  # ---------------------------------------------------------------------------
  asc-inspect:
    name: Slow Burn — App Store Connect state (read-only)
    instance_type: mac_mini_m2
    max_build_duration: 15
    integrations:
      app_store_connect: ChordLoopAPIKey
    environment:
      vars:
        ASC_APP_ID: "6787719986"
      xcode: latest
    scripts:
      - name: Dump the App Store Connect state (reads only, writes nothing)
        script: python3 scripts/asc-inspect.py "$ASC_APP_ID"

  # ---------------------------------------------------------------------------
  # Finish the "Small Tip" in-app purchase so it can be submitted.
  #
  # The product exists in App Store Connect but has never been completed, so it
  # sits in MISSING_METADATA — and an IAP in that state cannot be attached to a
  # review submission at all. This fills in the price, the territory
  # availability and the mandatory App Review screenshot, and it is idempotent:
  # anything already correct is reported and skipped.
  #
  # It touches ONE product id and nothing else. It never touches the app
  # version or a review submission — that is asc-release.py's job, behind its
  # own gates.
  #
  # No `triggering:` block, so a push can never run it, and it writes NOTHING
  # unless APPLY_IAP is exactly "true" — which is deliberately not set here, so
  # the safe state is the default rather than a toggle someone has to remember.
  #     scripts/cm-build.sh -w asc-iap --watch                       # plan
  #     scripts/cm-build.sh -w asc-iap --env APPLY_IAP=true --watch  # write
  # ---------------------------------------------------------------------------
  asc-iap:
    name: Slow Burn — complete the Small Tip in-app purchase
    instance_type: mac_mini_m2
    max_build_duration: 15
    integrations:
      app_store_connect: ChordLoopAPIKey
    environment:
      vars:
        ASC_APP_ID: "6787719986"
      xcode: latest
    scripts:
      - name: Complete the in-app purchase (plans unless APPLY_IAP=true)
        script: python3 scripts/asc-iap.py
