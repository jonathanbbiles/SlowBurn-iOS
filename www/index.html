<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#FFF8F1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Slow Burn" />
<title>Slow Burn</title>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5/dist/mqtt.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<!-- QR DECODER — vendored, not from a CDN. Two people trying to pair should
     not need a third-party host to be reachable. Decoding is on-device. -->
<script src="vendor/jsQR.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@600;700&family=Oswald:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --page:#3A0E2E;--page-2:#5A1440;--app-bg:#FFF8F1;--surface:#FFFFFF;--surface-2:#FFF1F7;
    --primary:#FF42B3;--primary-d:#E42E9A;--plum:#F94F5C;--plum-d:#E23B49;--rose:#FF8FC7;
    --ink:#3A0E2E;--muted:#9A7E8E;--muted-2:#C0A9B4;--line:#F3DDEA;--line-2:#EBCADD;
    --sage:#6E8B6E;--sage-bg:#EAF3EA;--gold:#FFC94D;--shadow:0 18px 50px rgba(58,14,46,.32);
    --display:"Anton","Oswald",system-ui,sans-serif;
    --serif:"Oswald",system-ui,sans-serif;
    --script:"Caveat",cursive;
    --sans:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{height:100%}
  html,body{margin:0;padding:0}
  /* The app ALWAYS fills its viewport — phone, tablet, portrait, landscape.
     There is no device-frame mockup and no centered fixed-width card. */
  body{font-family:var(--sans);color:var(--ink);background:var(--app-bg);
    min-height:100vh;height:100vh;height:100svh;overflow:hidden;
    display:flex;flex-direction:column;align-items:stretch}

  .proto-bar{width:100%;margin:0;display:flex;flex-wrap:wrap;gap:12px;align-items:center;
    justify-content:space-between;background:var(--surface);border:0;border-bottom:1px solid var(--line);
    border-radius:0;padding:7px 12px;padding-top:calc(7px + env(safe-area-inset-top));
    color:var(--ink);flex:none;position:relative;z-index:60}
  .pb-title{font-weight:600;font-size:12px;display:flex;align-items:center;gap:9px;color:var(--ink)}
  .pb-dot{width:9px;height:9px;border-radius:50%;background:var(--rose);box-shadow:none}
  .pb-dot.live{background:#5fce8f;box-shadow:0 0 0 4px rgba(95,206,143,.18);animation:pulse 1.8s infinite}
  .pb-dot.off{background:#c98a6f;box-shadow:none}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  .pb-sub{display:none;color:var(--muted);font-weight:400;font-size:12px}
  .pb-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .view-label{font-size:12px;color:var(--muted)}
  .seg{display:inline-flex;background:var(--surface-2);border-radius:11px;padding:3px}
  .seg button{border:0;background:transparent;color:var(--muted);font-family:var(--sans);font-size:13px;font-weight:600;
    padding:7px 14px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:7px}
  .seg button .who-dot{width:8px;height:8px;border-radius:50%}
  .seg button[data-view="A"] .who-dot{background:var(--primary)}
  .seg button[data-view="B"] .who-dot{background:var(--plum)}
  .seg button.on{background:var(--primary);color:#fff}
  .btn-ghost-lite{background:transparent;border:1px solid var(--line-2);color:var(--muted);border-radius:10px;
    padding:8px 13px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--sans)}
  .btn-ghost-lite:hover{background:var(--surface-2)}

  /* App shell — fills the window at ANY size (phone/tablet, portrait/landscape).
     Previously a fixed 392x812 device mockup with a bezel + fake notch, which is what
     produced the "floating phone card" on iPad that Apple rejected under Guideline 4. */
  .phone{width:100%;max-width:100%;flex:1;min-height:0;height:auto;background:var(--app-bg);
    border-radius:0;padding:0;box-shadow:none;position:relative;display:flex;flex-direction:column}
  .screen{position:relative;width:100%;height:auto;flex:1;min-height:0;background:var(--app-bg);
    border-radius:0;overflow:hidden;display:flex;flex-direction:column}
  .notch{display:none}
  .view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
  .view::-webkit-scrollbar{width:0}
  .pad{padding:26px 22px 30px;padding-top:calc(26px + env(safe-area-inset-top))}
  .pad-tab{padding:22px 20px 112px;padding-bottom:calc(98px + env(safe-area-inset-bottom))}

  h1,h2,h3{font-family:var(--serif);font-weight:700;color:var(--ink);margin:0;letter-spacing:.02em;text-transform:uppercase}
  .display{font-family:var(--display);font-size:30px;line-height:1.02;letter-spacing:.02em;font-weight:400;text-transform:uppercase}
  .script{font-family:var(--script);text-transform:none;font-weight:700}
  .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--primary);font-weight:700;font-family:var(--sans)}
  .lead{font-size:15px;line-height:1.55;color:var(--muted)}
  .tiny{font-size:12px;color:var(--muted-2)}
  p{margin:0}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;width:100%;background:var(--primary);color:#fff;border:0;
    border-radius:15px;padding:16px 20px;font-family:var(--sans);font-size:15.5px;font-weight:650;cursor:pointer;transition:.16s;
    box-shadow:0 10px 22px -10px rgba(255,66,179,.75)}
  .btn:hover{background:var(--primary-d)}
  .btn:disabled{background:#D8C6BC;color:#fff;box-shadow:none;cursor:not-allowed}
  .btn-plum{background:var(--plum);box-shadow:0 10px 22px -10px rgba(249,79,92,.7)}
  .btn-plum:hover{background:var(--plum-d)}
  .btn-soft{background:var(--surface);color:var(--ink);border:1.5px solid var(--line-2);box-shadow:none;font-weight:600}
  .btn-soft:hover{background:var(--surface-2)}
  .link{background:none;border:0;color:var(--primary);font-family:var(--sans);font-size:13.5px;font-weight:600;cursor:pointer;padding:6px;text-decoration:none}
  .row{display:flex;gap:10px}.row>.btn{width:auto;flex:1}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 2px 10px rgba(80,50,40,.03)}
  .card+.card{margin-top:14px}
  .card-soft{background:var(--surface-2);border:1px solid var(--line);border-radius:18px;padding:16px}
  .card-tap{cursor:pointer;transition:.15s}.card-tap:hover{border-color:var(--line-2)}

  .welcome{height:100%;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(120% 85% at 50% 0%,#FFF8F1 0%,#FDE6C7 42%,#FBD0E2 100%)}
  .mark{width:58px;height:58px;border-radius:18px;background:linear-gradient(150deg,var(--primary),var(--plum));display:flex;align-items:center;justify-content:center;box-shadow:0 12px 26px -10px rgba(249,79,92,.6)}
  .mark svg{width:30px;height:30px}
  .flame-emblem{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}

  .callout{background:var(--sage-bg);border:1px solid #D5E2D0;border-radius:16px;padding:16px;color:#3c5238;font-size:13.5px;line-height:1.5}
  .check-row{display:flex;gap:12px;align-items:flex-start;padding:14px 4px;cursor:pointer}
  .cbox{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--line-2);background:var(--surface);display:flex;align-items:center;justify-content:center;transition:.15s;margin-top:1px}
  .cbox.on{background:var(--primary);border-color:var(--primary)}
  .cbox svg{width:14px;height:14px;opacity:0}.cbox.on svg{opacity:1}
  .ctext{font-size:13.5px;line-height:1.5;color:var(--ink)}

  .field{width:100%;border:1.5px solid var(--line-2);border-radius:13px;padding:14px;font-family:var(--sans);font-size:16px;color:var(--ink);background:var(--surface)}
  .field:focus{outline:none;border-color:var(--rose)}
  .field.code{letter-spacing:.22em;text-transform:uppercase;font-weight:700;text-align:center;font-family:var(--serif);font-size:22px;color:var(--plum)}
  .scanbox{position:relative;width:100%;aspect-ratio:1/1;border-radius:20px;overflow:hidden;background:#2B2126;
    border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
  .scanbox video{width:100%;height:100%;object-fit:cover;display:block}
  .scanframe{position:absolute;inset:14%;border-radius:16px;border:3px solid rgba(255,255,255,.9);
    box-shadow:0 0 0 100vmax rgba(0,0,0,.28)}
  .qrbox{display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;min-height:170px}
  .qrbox img,.qrbox canvas{border-radius:6px}
  .codepill{font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:.14em;color:var(--plum);text-align:center}
  .opt{display:flex;gap:14px;align-items:center;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;cursor:pointer;transition:.15s}
  .opt:hover{border-color:var(--rose)}
  .opt .oic{flex:none;width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);border:1px solid var(--line)}
  .opt .ttl{font-family:var(--serif);font-size:16px;font-weight:600}
  .opt .dsc{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.4}

  .apphead{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 8px;
    padding-top:calc(16px + env(safe-area-inset-top))}
  .apphead .greet{font-size:12.5px;color:var(--muted)}
  .apphead .who{font-family:var(--serif);font-size:20px}
  .pill{display:inline-flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--muted)}
  .pill .g{width:8px;height:8px;border-radius:50%;background:var(--sage)}
  .pill .g.off{background:var(--muted-2)}
  .avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px}
  .avatar.A{background:linear-gradient(150deg,var(--primary),var(--rose))}
  .avatar.B{background:linear-gradient(150deg,var(--plum),#9E7690)}

  .rail{display:flex;align-items:center;gap:6px;margin:14px 0 2px}
  .rail .seg-b{height:6px;border-radius:4px;flex:1;background:var(--line-2)}
  .rail .seg-b.done{background:var(--primary)}
  .rail .seg-b.cur{background:linear-gradient(90deg,var(--primary),var(--rose))}

  .stage-item{display:flex;gap:14px;align-items:center;padding:15px 16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;cursor:pointer;transition:.15s}
  .stage-item+.stage-item{margin-top:11px}
  .stage-item:hover{border-color:var(--line-2)}
  .stage-item.locked{opacity:.62;cursor:default;background:var(--surface-2)}
  .st-num{flex:none;width:40px;height:40px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:17px;font-weight:600;color:var(--plum)}
  .stage-item.done .st-num{background:var(--primary);color:#fff;border-color:var(--primary)}
  .stage-item.cur .st-num{background:linear-gradient(150deg,var(--primary),var(--rose));color:#fff;border-color:transparent}
  .st-body{flex:1;min-width:0}
  .st-title{font-family:var(--serif);font-size:16px;font-weight:600}
  .st-sub{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .st-tag{flex:none}
  .badge{flex:none;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:999px}
  .badge.cur{background:#F6E4DC;color:var(--primary-d)}
  .badge.done{background:var(--sage-bg);color:#4c6b48}

  .deck-label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:4px}
  .chip{border:1.5px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:999px;padding:10px 15px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:var(--sans);transition:.14s;user-select:none}
  .chip:hover{border-color:var(--rose)}
  .chip.sel{background:var(--primary);border-color:var(--primary);color:#fff}
  .chip.readonly{cursor:default}
  .chip.match{background:var(--sage-bg);border-color:#CFE0C9;color:#3f5c3a}

  textarea.note{width:100%;border:1.5px solid var(--line-2);border-radius:14px;padding:14px;font-family:var(--sans);font-size:16px;color:var(--ink);background:var(--surface);resize:none;min-height:90px;line-height:1.5}
  textarea.note:focus{outline:none;border-color:var(--rose)}
  .lock-note{display:flex;align-items:center;gap:7px;color:var(--muted-2);font-size:11.5px;margin-top:7px}

  .timer{font-family:var(--serif);font-size:44px;font-weight:600;color:var(--plum);text-align:center;letter-spacing:.02em}
  .step{display:flex;gap:13px;padding:12px 0;border-bottom:1px solid var(--line)}
  .step:last-child{border-bottom:0}
  .step .dot{flex:none;width:24px;height:24px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--plum)}
  .step .stx{font-size:13.5px;line-height:1.5;color:var(--ink)}

  .gate{background:linear-gradient(160deg,#FBF4EE,#F6E9DF);border:1px solid var(--line-2);border-radius:20px;padding:20px}
  .gate .g-icon{width:44px;height:44px;border-radius:13px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;margin-bottom:12px}
  .status-line{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;padding:9px 0}
  .s-dot{width:10px;height:10px;border-radius:50%}.s-dot.on{background:var(--sage)}.s-dot.off{background:var(--line-2)}

  .tabs{position:absolute;left:0;right:0;bottom:0;height:82px;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:8px 8px calc(20px + env(safe-area-inset-bottom));z-index:30}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;background:none;cursor:pointer;color:var(--muted-2);font-family:var(--sans);font-size:10.5px;font-weight:600}
  .tab svg{width:23px;height:23px}
  .tab.on{color:var(--primary)}
  .notif{position:absolute;top:9px;right:calc(50% - 22px);width:8px;height:8px;border-radius:50%;background:var(--primary);border:2px solid #fff}

  .divider{height:1px;background:var(--line);margin:18px 0}
  .mt6{margin-top:6px}.mt10{margin-top:10px}.mt14{margin-top:14px}.mt18{margin-top:18px}.mt24{margin-top:24px}
  .center{text-align:center}
  .foot-legal{font-size:10.5px;color:var(--muted-2);text-align:center;line-height:1.5;padding:14px 10px 4px}
  .kv{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .kv:last-child{border-bottom:0}.kv .k{color:var(--muted)}.kv .v{font-weight:600}
  .toast{position:absolute;left:16px;right:16px;bottom:96px;background:var(--ink);color:#F5ECE4;border-radius:14px;padding:13px 16px;font-size:13px;font-weight:500;box-shadow:0 12px 30px rgba(0,0,0,.3);opacity:0;transform:translateY(10px);transition:.25s;z-index:50;text-align:center}
  .toast.show{opacity:1;transform:translateY(0)}
  .back{background:none;border:0;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;padding:4px 0;font-family:var(--sans)}
  .livebar{display:flex;align-items:center;gap:8px;justify-content:center;background:#EAF0E8;border:1px solid #D5E2D0;color:#3f5c3a;font-size:12px;font-weight:600;padding:8px;border-radius:12px}
  .livebar.off{background:#F6ECE6;border-color:#EAD6CB;color:#8a6552}

  /* Large screens (iPad, landscape iPhone, desktop). The app still fills the window; content is
     constrained to a comfortable reading column centred on the app's OWN background, while the
     chrome (top bar, tab bar) stays full-bleed. Because the column sits on the same background,
     it reads as an intentional layout — never as a floating card. */
  @media(min-width:768px){
    .pb-sub{display:inline}
    .apphead,.pad,.pad-tab{max-width:720px;margin-left:auto;margin-right:auto;width:100%}
    .tabs{padding-left:max(8px,calc((100% - 720px) / 2));padding-right:max(8px,calc((100% - 720px) / 2))}
    .toast{left:50%;right:auto;width:min(560px,calc(100% - 32px));transform:translateX(-50%) translateY(10px)}
    .toast.show{transform:translateX(-50%) translateY(0)}
  }
</style>
</head>
<body>
  <div id="protobar" class="proto-bar"></div>
  <div class="phone"><div class="screen"><div class="notch"></div><div class="view" id="root"></div><div id="toast" class="toast"></div></div></div>

<script>
/* ============================================================
   Slow Burn — phone client (solo mode + live two-device pairing)
   ============================================================ */
/* ============================================================
   IDENTITY MODEL
   ------------------------------------------------------------
   Slow Burn adapts to whoever is actually using it. Nothing in
   the program assumes a gender, an orientation, a body, or a
   monogamous couple. Everything below feeds ONE templating
   layer (see T() further down) that every user-facing string in
   the app passes through, so there is exactly one place where
   person-specific language is decided.

   Defaults are deliberately inclusive, not "male + female":
   unset pronouns resolve to they/them, unset partner term
   resolves to "partner", and an unset structure is treated as
   unspecified rather than monogamous.
   ============================================================ */
const GENDERS=[
  {id:"woman",     label:"Woman"},
  {id:"man",       label:"Man"},
  {id:"nonbinary", label:"Non-binary"},
  {id:"genderfluid",label:"Genderfluid"},
  {id:"agender",   label:"Agender"},
  {id:"custom",    label:"Self-describe"},
  {id:"na",        label:"Prefer not to say"}
];
const PSET_SHE ={they:"she", them:"her", their:"her", theirs:"hers", themself:"herself",   theyre:"she’s",  theyve:"she’s"};
const PSET_HE  ={they:"he",  them:"him", their:"his", theirs:"his",  themself:"himself",   theyre:"he’s",   theyve:"he’s"};
const PSET_THEY={they:"they",them:"them",their:"their",theirs:"theirs",themself:"themselves",theyre:"they’re",theyve:"they’ve"};
const PRONOUNS=[
  {id:"she",   label:"she/her",  set:PSET_SHE},
  {id:"he",    label:"he/him",   set:PSET_HE},
  {id:"they",  label:"they/them",set:PSET_THEY},
  {id:"shethey",label:"she/they",set:PSET_SHE},
  {id:"hethey",label:"he/they",  set:PSET_HE},
  {id:"custom",label:"Self-describe",set:null},
  {id:"na",    label:"Prefer not to say",set:PSET_THEY}
];
const ORIENTATIONS=[
  {id:"straight", label:"Straight"},
  {id:"gay",      label:"Gay"},
  {id:"lesbian",  label:"Lesbian"},
  {id:"bi",       label:"Bisexual"},
  {id:"pan",      label:"Pansexual"},
  {id:"queer",    label:"Queer"},
  {id:"ace",      label:"Asexual / ace-spectrum"},
  {id:"demi",     label:"Demisexual"},
  {id:"questioning",label:"Questioning"},
  {id:"custom",   label:"Self-describe"},
  {id:"na",       label:"Prefer not to say"}
];
const STRUCTURES=[
  {id:"solo",  label:"Solo — just me",        dsc:"A practice of your own. Every stage has a solo form."},
  {id:"mono",  label:"Monogamous",            dsc:"One partnership, closed."},
  {id:"open",  label:"Open relationship",     dsc:"A core partnership with agreed openness."},
  {id:"enm",   label:"Ethically non-monogamous",dsc:"More than one connection, openly and by agreement."},
  {id:"poly",  label:"Polyamorous",           dsc:"Multiple partners. Run Slow Burn once per partnership."},
  {id:"ra",    label:"Relationship anarchy",  dsc:"Your own agreements, without a default hierarchy."},
  {id:"custom",label:"Self-describe",         dsc:"Name it in your own words."},
  {id:"na",    label:"Prefer not to say",     dsc:"We’ll keep the language neutral."}
];
/* What you call the person you're practising with. Purely a label —
   it never implies a gender for them, and they set their own. */
const PARTNER_TERMS=["partner","spouse","wife","husband","girlfriend","boyfriend","enbyfriend","datemate","sweetheart","lover","companion","self-describe"];
/* How the program should name intimate areas. Sensate Focus needs to be
   explicit about what is and isn't in scope per stage, but the wording
   shouldn't assume anyone's anatomy. */
const AREA_STYLES=[
  {id:"inclusive",label:"Chest and genitals",       dsc:"Anatomy-neutral. The default."},
  {id:"clinical", label:"Breasts, chest and genitals",dsc:"More explicitly clinical."},
  {id:"own",      label:"“The areas we named”",     dsc:"You decide together, off-app, what’s in scope."}

function meName(){ return firstName(person(activeRole()).name)||"you"; }
/* The partner's label. A name if we have one; otherwise the term THEY chose
   ("your partner", "your datemate"…). Never a gendered guess. */
function partnerTerm(){
  const p=S.profile;
  const t=(p.partnerTerm==="self-describe"?(p.partnerTermCustom||"partner"):(p.partnerTerm||"partner"));
  return t.trim()||"partner";
}
function otherName(){ return firstName(person(partnerRole()).name)||("your "+partnerTerm()); }

/* Pronoun set for a role — falls back to they/them whenever unset. */
function pronounSet(role){
  const p=person(role);
  if(p.pronouns==="custom"){
    const parts=(p.pronounsCustom||"").split("/").map(x=>x.trim()).filter(Boolean);
    if(parts.length>=2){
      const [they,them]=parts;
      const their=parts[2]||them, theirs=parts[3]||their, themself=parts[4]||(them+"self");
      return {they,them,their,theirs,themself,theyre:they+"’s",theyve:they+"’s"};
    }
    return PSET_THEY;
  }
  const found=PRONOUNS.find(x=>x.id===p.pronouns);
  return (found&&found.set)||PSET_THEY;
}
function pronounLabel(role){
  const p=person(role);
  if(p.pronouns==="custom") return p.pronounsCustom||"they/them";
  const f=PRONOUNS.find(x=>x.id===p.pronouns);
  return f?(f.id==="na"?"they/them":f.label):"they/them";
}
function structureLabel(){
  const p=S.profile;
  if(p.structure==="custom") return p.structureCustom||"Self-described";
  const f=STRUCTURES.find(x=>x.id===p.structure);
  return f?f.label:"Not specified";
}
function genderLabel(role){
  const p=person(role);
  if(p.gender==="custom") return p.genderCustom||"Self-described";
  const f=GENDERS.find(x=>x.id===p.gender);
  return f?f.label:"Not specified";
}
function orientationLabel(role){
  const p=person(role);
  if(p.orientation==="custom") return p.orientationCustom||"Self-described";
  const f=ORIENTATIONS.find(x=>x.id===p.orientation);
  return f?f.label:"Not specified";
}
/* Multiple partners? Then the program is run once per partnership, and copy
   should say so rather than implying this is your only connection. */
function isMultiPartner(){ return ["enm","poly","ra","open"].indexOf(S.profile.structure)>=0; }
function areaPhrase(){
  const st=S.profile.areas||"inclusive";
  if(st==="clinical") return "breasts, chest and genitals";
  if(st==="own") return isSolo()?"the areas you’ve named for yourself":"the areas you’ve named between you";
  return "chest and genitals";
}

/* ============================================================
   T() — THE TEMPLATING LAYER
   ------------------------------------------------------------
   Every person-dependent string in Slow Burn goes through here.
   If a profile field is unset, the token resolves to inclusive,
   gender-neutral language rather than to a default gender.
   ============================================================ */
function T(str){
  if(!str) return "";
  const ps=pronounSet(partnerRole());
  const solo=isSolo();
  const pname=otherName();
  const term=partnerTerm();
  const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
  const us = solo ? "you"
           : (isMultiPartner() ? "you and "+pname : "the two of you");
  const map={
    me:meName(),                 Me:cap(meName()),
    partner:pname,               Partner:cap(pname),
    pterm:term,                  Pterm:cap(term),
    pterms:term+"s",             Pterms:cap(term)+"s",
    they:ps.they,                They:cap(ps.they),
    them:ps.them,                Them:cap(ps.them),
    their:ps.their,              Their:cap(ps.their),
    theirs:ps.theirs,            Theirs:cap(ps.theirs),
    themself:ps.themself,
    theyre:ps.theyre,            Theyre:cap(ps.theyre),
    theyve:ps.theyve,            Theyve:cap(ps.theyve),
    us:us,                       Us:cap(us),
    areas:areaPhrase(),          Areas:cap(areaPhrase()),
    together: solo?"on your own":"together",
    Together: solo?"On your own":"Together"
  };
  return String(str).replace(/\{(\w+)\}/g,(m,k)=>(k in map)?map[k]:m);
}
/* Escape-then-template, for anything that lands in innerHTML. */
function TE(str){ return T(esc(str)); }

/* Stage accessors that respect solo vs partnered. */
function stTitle(st){ return (isSolo()&&st.soloTitle)||st.title; }
function stSub(st){ return (isSolo()&&st.soloSub)||st.sub; }
function stIntent(st){ return T((isSolo()&&st.soloIntent)||st.intent); }
function stSteps(st){ return ((isSolo()&&st.soloSteps)||st.steps).map(T); }
function stBounds(st){ return T((isSolo()&&st.soloBounds)||st.bounds); }
/* Every chip the user may CHOOSE — the open decks only. The wire lists
   (GOOD/MORE) stay complete regardless, so indexes never shift. */
function goodChips(){ return decksOpen().reduce((a,d)=>a.concat(deckGood(d)),[]); }
function moreChips(){ return decksOpen().reduce((a,d)=>a.concat(deckMore(d)),[]); }

/* ---- derived ---- */
/* Solo unlocks on your own readiness; partnered still requires BOTH — the
   consent gate is the point of the app and it is unchanged. */
/* How far along this device's own user has consented to go: the highest
   stage they have confirmed, counting only from stage 1 up without a gap.
   This single small integer is the ENTIRE payload that crosses between two
   paired phones. */
function myStagePointer(){let n=0;for(let s=1;s<=6;s++){if(me().ready[s])n=s;else break;}return n;}
/* Has the partner consented to move past stage s?
   · live   → from the received stage pointer, the only thing they send
   · shared → both people are on this one phone, so read their local answer
   · solo   → there is no partner */
function partnerReadyFor(s){
  if(isSolo())return false;
  if(S.mode==="live")return s<=(S.partnerStage||0);
  return !!S.data[partnerRole()].ready[s];
}
function maxUnlocked(){
  let n=1;
  for(let s=1;s<=6;s++){
    const ok=isSolo()?!!S.data[activeRole()].ready[s]:(!!me().ready[s]&&partnerReadyFor(s));
    if(ok)n=Math.max(n,s+1);
  }
  return Math.min(n,6);
}
function totalSessions(w){let n=0;for(let s=1;s<=6;s++)n+=(S.data[w].sessions[s]||0);return n;}
/* ---- reflection matching ----
   Two ways the other person's chip selections can be present:
     · shared-device — both reflections were typed on this phone
     · live pairing  — they arrived over the end-to-end encrypted link
   Either way the app only ever DISPLAYS the overlap. In live mode there is
   nothing to match until the handshake is confirmed. */
function canMatch(){
  if(S.mode==="shared") return true;
  return S.mode==="live"&&E2E.secure();
}
function myDebrief(s){ return me().debrief[s]||null; }
function theirDebrief(s){
  if(S.mode==="shared") return S.data[partnerRole()].debrief[s]||null;
  if(S.mode==="live")   return (S.partnerDebrief||{})[s]||null;
  return null;
}
/* Overlap only — never the chips only one of you named. */
function matchFor(s){
  const a=myDebrief(s), b=theirDebrief(s);
  if(!a||!b) return null;
  return {good:(a.good||[]).filter(x=>(b.good||[]).includes(x)),
          more:(a.more||[]).filter(x=>(b.more||[]).includes(x))};
}
function hasNewMatch(){
  if(!canMatch())return false;
  for(let s=1;s<=6;s++){ if(matchFor(s)) return true; }
  return false;
}

/* ---- profile persistence (local only — never transmitted) ---- */
const PROFILE_KEY="sb_profile_v2";
function saveProfile(){
  try{ localStorage.setItem(PROFILE_KEY,JSON.stringify({profile:S.profile,mode:S.mode})); }catch(e){}
}
function loadProfile(){
  try{
    const raw=localStorage.getItem(PROFILE_KEY); if(!raw) return false;
    const o=JSON.parse(raw); if(!o||!o.profile||!o.profile.done) return false;
    S.profile=Object.assign(freshState().profile,o.profile);
    S.profile.people=Object.assign({A:blankPerson(),B:blankPerson()},o.profile.people||{});
    if(o.mode) S.mode=o.mode;
    return true;
  }catch(e){ return false; }
}
function clearProfile(){ try{ localStorage.removeItem(PROFILE_KEY); }catch(e){} }

/* ---- theme (cosmetic, on-device) ---- */
const THEME_KEY="sb_theme_v1";
function themeById(id){ return THEMES.find(t=>t.id===id)||THEMES[0]; }
function applyTheme(id){
  const t=themeById(id);
  /* A Pro theme must not survive a lost entitlement. */
  const use=(t.pro&&!Pro.active())?THEMES[0]:t;
  S.theme=use.id;
  const root=document.documentElement;
  /* Reset first so switching themes never leaves a stale variable behind. */
  THEMES.forEach(x=>Object.keys(x.vars).forEach(k=>root.style.removeProperty(k)));
  Object.keys(use.vars).forEach(k=>root.style.setProperty(k,use.vars[k]));
  try{ localStorage.setItem(THEME_KEY,use.id); }catch(e){}
}
function loadTheme(){
  let id="ember";
  try{ id=localStorage.getItem(THEME_KEY)||"ember"; }catch(e){}
  applyTheme(id);
}

/* ---- keepsake journal (Pro, opt-in, never leaves the device) ----
   OFF by default on purpose. Reflections are the most personal thing in the
   app, and writing them to disk is a decision the person should make, not one
   they discover later. Turning it off deletes what is already there. */
const JOURNAL_KEY="sb_journal_v1", JOURNAL_ON_KEY="sb_journal_on_v1";
function loadJournal(){
  try{ S.journalOn=localStorage.getItem(JOURNAL_ON_KEY)==="1"; }catch(e){ S.journalOn=false; }
  try{ S.journal=JSON.parse(localStorage.getItem(JOURNAL_KEY)||"[]")||[]; }catch(e){ S.journal=[]; }
  if(!Array.isArray(S.journal)) S.journal=[];
}
function saveJournal(){
  try{ localStorage.setItem(JOURNAL_KEY,JSON.stringify(S.journal.slice(-300))); }catch(e){}
}
function journalAdd(stage,good,more,note){
  if(!Pro.active()||!S.journalOn) return;
  S.journal.push({ts:Date.now(),stage:stage,good:good.slice(),more:more.slice(),note:note||""});
  saveJournal();
}
function journalClear(){
  S.journal=[];
  try{ localStorage.removeItem(JOURNAL_KEY); }catch(e){}
}
function setJournalOn(on){
  S.journalOn=!!on;
  try{ localStorage.setItem(JOURNAL_ON_KEY,S.journalOn?"1":"0"); }catch(e){}
  if(!S.journalOn) journalClear();      // off means gone, not hidden
}
function journalDate(ts){
  try{ return new Date(ts).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}); }
  catch(e){ return ""; }
}

/* ============================================================
   LIVE PAIRING — END-TO-END ENCRYPTED (protocol v4)
   ------------------------------------------------------------
   Two paired phones have to compare private answers — the shared
   consent gate and the "what you both welcome more of" match are the
   reason this app exists. They now do it without a server and without
   showing the relay anything, by agreeing on a key the relay never sees.

   HANDSHAKE (fresh per pairing, nothing persisted anywhere)
     1. Each phone generates an ephemeral ECDH P-256 key pair and
        publishes ONLY its PUBLIC key on sb4/<sid>/k/<side>.
     2. Each derives the same shared secret on-device from its own
        private key and the other's public key. The shared secret is
        NEVER transmitted, in any form.
     3. HKDF-SHA-256 over that secret — salted with a hash of the PAIR
        CODE, and bound to the full transcript (both public keys in a
        fixed order) — yields:
          · a 256-bit AES-GCM message key
          · two one-way confirmation keys, one per direction
          · a 6-character safety word, shown on both phones
     4. Each side publishes an HMAC confirmation tag on
        sb4/<sid>/c/<side>. Producing a valid tag requires the pair code
        (it is the HKDF salt), so a broker-side attacker who injects its
        own public key cannot complete the handshake. Nothing is
        encrypted, sent, decrypted or displayed until BOTH tags verify.
        The safety word is the human-checkable backstop: if it matches
        on both phones, there is no one in the middle.

   ON THE WIRE, IN FULL
     sb4/<sid>/k/<side>   ephemeral ECDH PUBLIC key   (public by design)
     sb4/<sid>/c/<side>   key-confirmation tag        (useless without the code)
     sb4/<sid>/m/<side>   AES-256-GCM ciphertext      (everything else)
     sb4/<sid>/x/<side>   last will / goodbye         (EMPTY payload)

   Every payload that carries meaning is inside /m/, i.e. ciphertext:
   presence, the stage pointer, and the reflection chip selections that
   make matching work. The relay sees random bytes.

   NEVER SENT — not even encrypted: names, pronouns, gender, orientation,
   relationship structure, session counts, and the free-text private note.
   Each phone words itself from its own owner's setup, so none of that
   needs to cross, and what is never sent cannot be broken.

   retain is FALSE on every publish including the will, so nothing is left
   behind for a stranger to read; both phones re-announce on a heartbeat.

   THREAT MODEL and honest limits: see PRIVACY.md. Short version — the
   broker still learns that two anonymous parties are exchanging encrypted
   messages, and their timing and size. It cannot read them. If
   crypto.subtle is unavailable, live pairing REFUSES to run rather than
   silently falling back to plaintext.
   ============================================================ */
const RELAY="wss://broker.emqx.io:8084/mqtt";
const TOPIC_ROOT="sb4";
const PROTO_V=4;

/* Compact SHA-256 (public-domain construction). Used synchronously and
   without a network or crypto.subtle dependency, so topic derivation works
   identically in the WKWebView, on file:// and on any static host. */
function sha256hex(str){
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  // UTF-8 encode
  const bytes=[];
  for(let i=0;i<str.length;i++){
    let c=str.charCodeAt(i);
    if(c<0x80)bytes.push(c);
    else if(c<0x800){bytes.push(0xc0|(c>>6),0x80|(c&63));}
    else if(c<0xd800||c>=0xe000){bytes.push(0xe0|(c>>12),0x80|((c>>6)&63),0x80|(c&63));}
    else{ c=0x10000+(((c&0x3ff)<<10)|(str.charCodeAt(++i)&0x3ff));
      bytes.push(0xf0|(c>>18),0x80|((c>>12)&63),0x80|((c>>6)&63),0x80|(c&63)); }
  }
  const bitLen=bytes.length*8;
  bytes.push(0x80);
  while(bytes.length%64!==56)bytes.push(0);
  for(let i=7;i>=0;i--)bytes.push((i<4?Math.floor(bitLen/Math.pow(2,i*8)):0)&255);
  const rr=(x,n)=>(x>>>n)|(x<<(32-n));
  const w=new Array(64);
  for(let off=0;off<bytes.length;off+=64){
    for(let i=0;i<16;i++)w[i]=(bytes[off+i*4]<<24)|(bytes[off+i*4+1]<<16)|(bytes[off+i*4+2]<<8)|bytes[off+i*4+3];
    for(let i=16;i<64;i++){
      const s0=rr(w[i-15],7)^rr(w[i-15],18)^(w[i-15]>>>3),
            s1=rr(w[i-2],17)^rr(w[i-2],19)^(w[i-2]>>>10);
      w[i]=(w[i-16]+s0+w[i-7]+s1)|0;
    }
    let [a,b,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){
      const S1=rr(e,6)^rr(e,11)^rr(e,25), ch=(e&f)^(~e&g), t1=(h+S1+ch+K[i]+w[i])|0,
            S0=rr(a,2)^rr(a,13)^rr(a,22), mj=(a&b)^(a&c)^(b&c), t2=(S0+mj)|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;
    }
    H=[(H[0]+a)|0,(H[1]+b)|0,(H[2]+c)|0,(H[3]+d)|0,(H[4]+e)|0,(H[5]+f)|0,(H[6]+g)|0,(H[7]+h)|0];
  }
  return H.map(x=>((x>>>0).toString(16).padStart(8,"0"))).join("");
}
/* Two INDEPENDENT derivations of the pair code, with different domain
   separators. The topic tells the broker where to route; the salt binds
   the key exchange to the code. Seeing one on the wire (the topic) reveals
   nothing about the other. The code itself never travels either way. */
function sessionId(code){ return sha256hex("slowburn/pairing/v4|topic|"+normCode(code)).slice(0,32); }
function pairSaltHex(code){ return sha256hex("slowburn/pairing/v4|salt|"+normCode(code)); }
function pairBase(){ return TOPIC_ROOT+"/"+sessionId(S.code); }

/* ---- byte plumbing (WebCrypto talks in bytes; MQTT carries text) ----
   UTF-8 is hand-rolled rather than taken from TextEncoder so the crypto path
   has exactly one implementation everywhere it runs — WKWebView, a plain
   browser, and the jsdom test harness alike. Payloads are a few dozen bytes,
   so there is nothing to gain from the native one. */
function utf8(s){
  s=String(s); const out=[];
  for(let i=0;i<s.length;i++){
    let c=s.charCodeAt(i);
    if(c<0x80)out.push(c);
    else if(c<0x800)out.push(0xc0|(c>>6),0x80|(c&63));
    else if(c<0xd800||c>=0xe000)out.push(0xe0|(c>>12),0x80|((c>>6)&63),0x80|(c&63));
    else{ c=0x10000+(((c&0x3ff)<<10)|(s.charCodeAt(++i)&0x3ff));
      out.push(0xf0|(c>>18),0x80|((c>>12)&63),0x80|((c>>6)&63),0x80|(c&63)); }
  }
  return new Uint8Array(out);
}
function unutf8(bytes){
  const b=new Uint8Array(bytes); let s="";
  for(let i=0;i<b.length;){
    const c=b[i++];
    if(c<0x80)s+=String.fromCharCode(c);
    else if(c<0xe0)s+=String.fromCharCode(((c&31)<<6)|(b[i++]&63));
    else if(c<0xf0)s+=String.fromCharCode(((c&15)<<12)|((b[i++]&63)<<6)|(b[i++]&63));
    else{ const cp=(((c&7)<<18)|((b[i++]&63)<<12)|((b[i++]&63)<<6)|(b[i++]&63))-0x10000;
      s+=String.fromCharCode(0xd800|(cp>>10),0xdc00|(cp&0x3ff)); }
  }
  return s;
}
function hexBytes(h){ const a=new Uint8Array(h.length>>1); for(let i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16); return a; }
function b64u(bytes){
  const b=new Uint8Array(bytes); let s="";
  for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);
  return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function unb64u(str){
  let s=String(str||"").replace(/-/g,"+").replace(/_/g,"/");
  while(s.length%4)s+="=";
  const bin=atob(s), a=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);
  return a;
}

/* ============================================================
   E2E — the whole cryptographic core, in one place.
   Nothing outside this module ever touches key material, and the
   module has no way to publish: it returns strings, the caller sends
   them. If a future change tries to put a secret on the wire it has
   to go through seal().
   ============================================================ */
const E2E=(function(){
  function blank(){ return {sid:"",priv:null,pubB64:"",theirB64:"",key:null,
    confMine:null,confTheirs:null,sas:"",derived:false,verified:false,
    pendingTag:null,seq:0,lastSeen:-1}; }
  let st=blank();
  function sub(){ try{ return (window.crypto&&window.crypto.subtle)||null; }catch(e){ return null; } }
  function supported(){ try{ return !!(sub()&&window.crypto.getRandomValues); }catch(e){ return false; } }
  function reset(){ st=blank(); }
  function derived(){ return !!st.derived; }
  function verified(){ return !!st.verified; }
  function secure(){ return !!(st.verified&&st.key); }
  function safety(){ return st.sas; }
  function myPub(){ return st.pubB64; }

  /* Our ephemeral key pair. Idempotent — the heartbeat re-announces the
     SAME public key rather than churning a new one every 12 seconds. */
  async function begin(sid){
    if(!supported()) throw new Error("no-subtle");
    if(st.priv&&st.sid===sid) return st.pubB64;
    st=blank(); st.sid=sid;
    const kp=await sub().generateKey({name:"ECDH",namedCurve:"P-256"},false,["deriveBits"]);
    st.priv=kp.privateKey;
    st.pubB64=b64u(new Uint8Array(await sub().exportKey("raw",kp.publicKey)));
    return st.pubB64;
  }

  async function hmacKey(raw){ return sub().importKey("raw",raw,{name:"HMAC",hash:"SHA-256"},false,["sign"]); }
  /* A short human-comparable word. Only ever used for two people to read
     the same thing aloud, so a slight modulo bias is irrelevant. */
  function sasFrom(b){ let s=""; for(let i=0;i<6;i++)s+=CODE_ALPHA[b[i]%CODE_ALPHA.length]; return s.slice(0,3)+"-"+s.slice(3); }

  /* ECDH → HKDF. The shared secret exists only as a local variable here
     and is zeroed before this function returns. It is never stored, never
     rendered, and there is no code path that can publish it. */
  async function derive(theirB64,code,mySide){
    if(!st.priv) throw new Error("no-keypair");
    if(st.derived&&st.theirB64===theirB64) return false;      // already have this one
    const theirRaw=unb64u(theirB64);
    if(theirRaw.length!==65||theirRaw[0]!==4) throw new Error("bad-point");
    const theirKey=await sub().importKey("raw",theirRaw,{name:"ECDH",namedCurve:"P-256"},false,[]);
    const bits=new Uint8Array(await sub().deriveBits({name:"ECDH",public:theirKey},st.priv,256));
    /* Transcript binding: both public keys, always in host-then-guest
       order, so each phone hashes the identical string. Swapping or
       replaying a key changes the derived key on both sides. */
    const hostB64 =(mySide==="h")?st.pubB64:theirB64;
    const guestB64=(mySide==="h")?theirB64:st.pubB64;
    const info=utf8("slowburn/e2e/v4|"+st.sid+"|"+hostB64+"|"+guestB64);
    const ikm=await sub().importKey("raw",bits,"HKDF",false,["deriveBits"]);
    const okm=new Uint8Array(await sub().deriveBits(
      {name:"HKDF",hash:"SHA-256",salt:hexBytes(pairSaltHex(code)),info:info},ikm,104*8));
    st.key=await sub().importKey("raw",okm.slice(0,32),{name:"AES-GCM"},false,["encrypt","decrypt"]);
    const kH=okm.slice(32,64), kG=okm.slice(64,96);
    st.confMine  =await hmacKey(mySide==="h"?kH:kG);   // the tag I send
    st.confTheirs=await hmacKey(mySide==="h"?kG:kH);   // the tag I expect
    st.sas=sasFrom(okm.slice(96,104));
    st.theirB64=theirB64; st.derived=true; st.verified=false;
    st.seq=0; st.lastSeen=-1;                          // fresh key ⇒ fresh replay window
    bits.fill(0); okm.fill(0);
    return true;
  }

  function tagMsg(side){ return utf8("slowburn/e2e/v4|confirm|"+side+"|"+st.sid); }
  async function myTag(mySide){
    return b64u(new Uint8Array(await sub().sign("HMAC",st.confMine,tagMsg(mySide))).slice(0,16));
  }
  async function checkTag(theirSide,tagB64){
    if(!st.confTheirs) return false;
    const want=new Uint8Array(await sub().sign("HMAC",st.confTheirs,tagMsg(theirSide))).slice(0,16);
    const got=unb64u(tagB64);
    if(got.length!==16) return false;
    let d=0; for(let i=0;i<16;i++)d|=want[i]^got[i];    // constant-time
    return d===0;
  }
  /* Their tag can legitimately arrive before we've derived (their key and
     their tag are two publishes). Hold it, check it the moment we can. */
  function stashTag(side,tag){ st.pendingTag={side:side,tag:tag}; }
  async function replayTag(){
    if(!st.pendingTag||!st.derived) return false;
    const t=st.pendingTag;
    if(await checkTag(t.side,t.tag)){ st.verified=true; st.pendingTag=null; return true; }
    return false;
  }
  function markVerified(){ st.verified=true; st.pendingTag=null; }

  /* Bound to this session and this sender, so a message cannot be replayed
     onto the other side's topic. */
  function aad(side){ return utf8("slowburn/e2e/v4|"+st.sid+"|"+side); }
  function nextSeq(){ return ++st.seq; }
  async function seal(obj,mySide){
    if(!st.key) throw new Error("not-secure");
    const iv=window.crypto.getRandomValues(new Uint8Array(12));
    const ct=new Uint8Array(await sub().encrypt(
      {name:"AES-GCM",iv:iv,additionalData:aad(mySide),tagLength:128},st.key,utf8(JSON.stringify(obj))));
    const out=new Uint8Array(12+ct.length); out.set(iv,0); out.set(ct,12);
    return b64u(out);
  }
  async function open(b64,theirSide){
    if(!st.key) throw new Error("not-secure");
    const raw=unb64u(b64);
    if(raw.length<29) throw new Error("short");
    const pt=await sub().decrypt(
      {name:"AES-GCM",iv:raw.slice(0,12),additionalData:aad(theirSide),tagLength:128},st.key,raw.slice(12));
    const env=JSON.parse(unutf8(new Uint8Array(pt)));
    const n=Number(env&&env.n);
    if(!(n>st.lastSeen)) throw new Error("replay");     // strictly increasing
    st.lastSeen=n;
    return env;
  }
  return {supported,reset,begin,derive,derived,verified,secure,safety,myPub,
          myTag,checkTag,stashTag,replayTag,markVerified,nextSeq,seal,open};
})();

/* The reflection chips are sent as INDEXES into these lists, never as text.
   The fingerprint travels with them so two different app versions can never
   silently mismap "Softer touch" onto something else. */
/* It covers the STARTER DECK ONLY, deliberately. That deck is frozen and
   identical in every version ever shipped, so it is the contract two phones
   can actually agree on. Slow Burn 1.0 computed this exact value over its only
   two chip lists — which WERE the starter deck — so a 1.0 phone and a 1.1
   phone still agree, still match on all sixteen shared chips, and 1.0 simply
   drops the Pro-deck indexes it does not recognise (applyEnvelope maps an
   unknown index to undefined and filters it out). Fingerprinting the full list
   would have disabled matching for every couple mid-rollout — for a pairing
   app, that is the whole product.
   The separators are U+0001 / U+0002 and must stay exactly that. */
const CHIPS_FP=sha256hex(STARTER.good.join("")+""+STARTER.more.join("")).slice(0,8);

/* The entire cleartext of the link, assembled here and nowhere else.
   Everything in it is either an integer or an index into a fixed list. */
function stateEnvelope(){
  const r={};
  for(let s=1;s<=6;s++){
    const d=me().debrief[s]; if(!d) continue;
    r[s]={g:(d.good||[]).map(x=>GOOD.indexOf(x)).filter(i=>i>=0),
          m:(d.more||[]).map(x=>MORE.indexOf(x)).filter(i=>i>=0)};
    /* d.note is deliberately absent. The private note is never sent. */
  }
  return {v:PROTO_V,n:E2E.nextSeq(),u:myStagePointer(),cf:CHIPS_FP,r:r};
}
/* The ONLY function that puts app state on the wire, and it cannot run
   before the handshake is confirmed. */
function publishState(){
  if(S.mode!=="live"||!S.mq||!S.connected||!E2E.secure()) return Promise.resolve(false);
  return E2E.seal(stateEnvelope(),S.pairSide).then(function(body){
    try{ S.mq.publish(pairBase()+"/m/"+S.pairSide,body,{retain:false,qos:0}); }catch(e){}
    return true;
  }).catch(function(){ return false; });
}
/* Kept as the name the readiness handlers call — the stage pointer now
   rides inside the same encrypted envelope as everything else. */
function publishProgress(){ return publishState(); }

function applyEnvelope(env){
  if(!env||env.v!==PROTO_V) return;
  S.partnerSeen=Date.now(); S.partnerOnline=true;
  const n=parseInt(env.u,10);
  if(n>=0&&n<=6) S.partnerStage=n;
  S.partnerChipMismatch=(env.cf!==CHIPS_FP);
  const out={};
  if(!S.partnerChipMismatch&&env.r&&typeof env.r==="object"){
    for(let s=1;s<=6;s++){
      const d=env.r[s]||env.r[String(s)]; if(!d) continue;
      out[s]={good:(Array.isArray(d.g)?d.g:[]).map(i=>GOOD[i]).filter(Boolean),
              more:(Array.isArray(d.m)?d.m:[]).map(i=>MORE[i]).filter(Boolean)};
    }
  }
  S.partnerDebrief=out;
  /* Their first message under this key: they may well have missed ours while
     they were still confirming, so answer with our own state once. */
  if(Number(env.n)===1) publishState();
  render();
}

/* Nothing is retained on the broker, so a phone that connects later cannot
   read the other's current state — both sides simply re-announce on a
   timer, and a partner falls back to "offline" if they go quiet. */
const HEARTBEAT_MS=12000, PARTNER_STALE_MS=40000;
function announceKey(){
  if(S.mode!=="live"||!S.mq||!S.connected) return Promise.resolve("");
  return E2E.begin(sessionId(S.code)).then(function(pub){
    try{ S.mq.publish(pairBase()+"/k/"+S.pairSide,pub,{retain:false,qos:0}); }catch(e){}
    return pub;
  }).catch(function(){ return ""; });
}
function sendTag(){
  if(S.mode!=="live"||!S.mq||!S.connected||!E2E.derived()) return Promise.resolve(false);
  return E2E.myTag(S.pairSide).then(function(tag){
    try{ S.mq.publish(pairBase()+"/c/"+S.pairSide,tag,{retain:false,qos:0}); }catch(e){}
    return true;
  }).catch(function(){ return false; });
}
function startHeartbeat(){
  stopHeartbeat();
  S.hb=setInterval(()=>{
    if(S.mode!=="live"||!S.connected) return;
    announceKey();                    // same public key, re-announced for a late joiner
    /* Re-send the confirmation tag too: nothing is retained and QoS 0 can
       drop, and a lost tag would otherwise strand both sides half-confirmed. */
    if(E2E.derived()) sendTag();
    if(E2E.secure()) publishState();
    if(S.partnerOnline&&S.partnerSeen&&(Date.now()-S.partnerSeen)>PARTNER_STALE_MS){S.partnerOnline=false;render();}
  },HEARTBEAT_MS);
}
function stopHeartbeat(){ if(S.hb){clearInterval(S.hb);S.hb=null;} }

/* Handshake progressed — reflect it in the UI and, once confirmed, send
   this phone's state so the other side is immediately up to date. */
function afterHandshake(){
  const ok=E2E.secure();
  S.pairSecure=ok; S.pairSafety=ok?E2E.safety():"";
  if(ok) publishState();
  render();
}
function onWire(topic,body){
  const p=String(topic).split("/"), kind=p[2], sd=p[3];
  if(sd===S.pairSide||(sd!=="h"&&sd!=="g")) return;
  if(kind==="x"){ S.partnerOnline=false; render(); return; }
  if(kind==="k"){
    E2E.begin(sessionId(S.code))
      .then(()=>E2E.derive(body,S.code,S.pairSide))
      .then(function(fresh){
        if(fresh===false) return null;                // same key we already have
        S.pairSecure=false; S.pairSafety=""; S.partnerDebrief={};
        /* They have only just arrived, and nothing is retained for them to
           read — so re-announce our key immediately rather than making them
           wait for the next heartbeat. Gated on the key being NEW, so the
           two phones exchange keys once and stop. */
        announceKey();
        return sendTag().then(function(){ return E2E.replayTag(); });   // their tag may already be waiting
      })
      .then(()=>afterHandshake())
      .catch(function(){});
    return;
  }
  if(kind==="c"){
    if(!E2E.derived()){ E2E.stashTag(sd,body); return; }
    if(E2E.verified()) return;
    E2E.checkTag(sd,body).then(function(ok){
      if(!ok) return;                                  // wrong pair code, or someone in the middle
      E2E.markVerified(); afterHandshake();
    }).catch(function(){});
    return;
  }
  if(kind==="m"){
    if(!E2E.secure()) return;                          // never decrypt an unconfirmed key
    E2E.open(body,sd).then(applyEnvelope).catch(function(){});
  }
}

/* ============================================================
   PAIR-CODE SCANNER — the app reads its own QR, on-device.
   ------------------------------------------------------------
   Both people must already have Slow Burn installed in order to pair, so
   there is nothing for a web URL to accomplish. The QR therefore encodes the
   BARE PAIR CODE and nothing else, and only this scanner reads it:

     · no URL is opened, so no universal link / custom scheme is involved
     · the system Camera app, if someone points it at the QR, just shows the
       ten characters — which is harmless, and readable enough to type in
     · a stray QR from the world cannot do anything: a scan is accepted only
       if it normalises to exactly CODE_LEN characters of our alphabet

   The camera frame never leaves the device: getUserMedia → <video> → an
   offscreen <canvas> → jsQR, all in this process. Nothing is recorded,
   uploaded, or kept, and the stream is stopped the moment a code is read or
   the sheet is closed. See PRIVACY.md.

   No camera, or permission refused → the scan button is never shown at all
   (same discipline as the tip jar: no dead buttons), and typing the code
   remains the primary path it always was.
   ============================================================ */
/* Is this scanned text one of OUR pair codes?

   It must be validated on the RAW string, never through normCode(): normCode
   strips every character outside [A-Z0-9] and then truncates to CODE_LEN, so
   "https://example.com/not-a-pair-code" comes out as a well-formed-looking
   "HTTPSEXAMP" and any sufficiently long text would be accepted as a pair
   code. Here the whole string, after nothing but whitespace removal, has to
   be exactly CODE_LEN characters drawn from the pair-code alphabet — which
   deliberately omits B, G, I, O, Q, S, V, Z and 0/1/2/5/8.
   Returns the code, or "" if it is not ours. */
function asPairCode(raw){
  const s=String(raw==null?"":raw).replace(/\s+/g,"").toUpperCase();
  if(s.length!==CODE_LEN) return "";
  for(let i=0;i<s.length;i++) if(CODE_ALPHA.indexOf(s.charAt(i))<0) return "";
  return s;
}

const Scanner=(function(){
  let stream=null,raf=null,video=null,canvas=null,ctx=null,onFound=null,active=false;
  /* Only offer scanning if this device can actually do it. */
  function supported(){
    try{ return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.jsQR); }
    catch(e){ return false; }
  }
  function stop(){
    active=false;
    if(raf){cancelAnimationFrame(raf);raf=null;}
    try{ if(stream) stream.getTracks().forEach(t=>t.stop()); }catch(e){}
    stream=null;
    if(video){ try{video.pause();video.srcObject=null;}catch(e){} }
    video=null;canvas=null;ctx=null;onFound=null;
  }
  function tick(){
    if(!active) return;
    if(video&&video.readyState===video.HAVE_ENOUGH_DATA){
      const w=video.videoWidth,h=video.videoHeight;
      if(w&&h){
        /* Downscale: jsQR is plenty accurate at ~640px and this keeps the
           scan loop cheap enough not to heat the phone. */
        const scale=Math.min(1,640/Math.max(w,h));
        canvas.width=Math.round(w*scale);canvas.height=Math.round(h*scale);
        ctx.drawImage(video,0,0,canvas.width,canvas.height);
        const img=ctx.getImageData(0,0,canvas.width,canvas.height);
        let res=null;
        try{ res=window.jsQR(img.data,img.width,img.height,{inversionAttempts:"dontInvert"}); }catch(e){}
        if(res&&res.data){
          const code=asPairCode(res.data);      // strict — see asPairCode()
          if(code){ const cb=onFound; stop(); if(cb) cb(code); return; }
          /* Not ours: keep looking rather than acting on it. */
        }
      }
    }
    raf=requestAnimationFrame(tick);
  }
  /* Returns a promise that resolves once the camera is live, or rejects with
     a reason the caller can show the user. */
  async function start(videoEl,cb){
    if(!supported()) throw new Error("unsupported");
    stop();
    video=videoEl;onFound=cb;
    canvas=document.createElement("canvas");ctx=canvas.getContext("2d",{willReadFrequently:true});
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:"environment"},audio:false});
    video.srcObject=stream;
    video.setAttribute("playsinline","");video.muted=true;
    await video.play().catch(()=>{});
    active=true;raf=requestAnimationFrame(tick);
  }
  return {supported,start,stop};
})();

function closeScan(msg){
  Scanner.stop();
  S.scanning=false;S.scanError="";
  render(); if(msg) toast(msg);
}
function openScan(){
  if(!Scanner.supported()){ toast("This device can’t scan — type the code instead."); return; }
  S.scanning=true;S.scanError="";render();
  /* The <video> only exists after the render above. */
  setTimeout(()=>{
    const v=document.getElementById("scanvideo");
    if(!v){ closeScan(); return; }
    Scanner.start(v,(code)=>{
      S.scanning=false;S.scanError="";
      S.pending=code;S.pairPhase="join";render();
      const f=document.getElementById("joincode"); if(f) f.value=prettyCode(code);
      toast("Code scanned — linking…");
      const nm=((document.getElementById("joinname")||{}).value||"").trim();
      connectLive("g",nm,code);
    }).catch((e)=>{
      /* Denied or unavailable: say so plainly and fall back to typing. */
      S.scanning=false;
      S.scanError=(e&&(e.name==="NotAllowedError"||e.name==="SecurityError"))
        ? "Camera access is off for Slow Burn. You can turn it on in Settings — or just type the code."
        : "Couldn’t open the camera. Type the code instead — it works exactly the same.";
      render();
    });
  },0);
}
function screenScan(){
  return `<div class="pad">
    <button class="back" data-action="scan-cancel">‹ Cancel</button>
    <div class="eyebrow mt10">Pairing</div>
    <h2 class="display" style="font-size:24px;margin-top:8px">Point at their code</h2>
    <p class="lead mt6" style="font-size:13.5px">${TE("Hold this over the QR on {their} phone. Slow Burn reads it right here — nothing opens, and no picture is taken or kept.")}</p>
    <div class="scanbox mt18"><video id="scanvideo" playsinline muted></video><div class="scanframe"></div></div>
    <button class="btn btn-soft mt18" data-action="scan-cancel">Type the code instead</button>
  </div>`;
}

function connectLive(side,name,code){
  /* No WebCrypto ⇒ no encrypted link ⇒ we do NOT pair. There is no
     plaintext fallback path in this app. */
  if(!E2E.supported()){ liveFail("This device can’t set up an encrypted link, so Slow Burn won’t pair over the network. Running solo instead."); return; }
  S.mode="live";S.pairSide=side;S.code=normCode(code);
  /* The name is this device owner's own, kept in their own slot, and used
     only to word this phone's copy. It is not published. */
  if(name)S.profile.people.A.name=name;
  S.partnerDebrief={};S.partnerStage=0;S.partnerOnline=false;
  S.pairSecure=false;S.pairSafety="";S.partnerChipMismatch=false;
  E2E.reset();
  if(!window.mqtt){liveFail();return;}
  const base=pairBase();
  let opened=false,client;
  try{
    client=mqtt.connect(RELAY,{clientId:"sb_"+Math.random().toString(16).slice(2),clean:true,
      connectTimeout:6000,reconnectPeriod:4000,keepalive:30,
      /* Empty payload: it says "this side dropped" and nothing else. The
         broker already knows a client disconnected — that is not a leak we
         can encrypt away, so we don't pretend otherwise. */
      will:{topic:base+"/x/"+side,payload:"",retain:false,qos:0}});
  }catch(e){liveFail();return;}
  S.mq=client;
  const to=setTimeout(()=>{if(!opened){try{client.end(true);}catch(e){}liveFail();}},8000);
  client.on("connect",()=>{
    opened=true;clearTimeout(to);S.connected=true;
    client.subscribe(base+"/k/+");client.subscribe(base+"/c/+");
    client.subscribe(base+"/m/+");client.subscribe(base+"/x/+");
    announceKey();
    startHeartbeat();
    if(S.pairPhase==="join"){S.screen="app";S.tab="today";}
    render();
  });
  client.on("message",(t,payload)=>{ onWire(t,payload.toString()); });
  client.on("error",()=>{});
}
function liveFail(msg){
  // Relay unreachable (offline / blocked network) → graceful solo fallback.
  stopHeartbeat(); E2E.reset();
  S.mode="solo";S.mq=null;S.connected=false;S.screen="app";S.tab="today";
  S.pairSecure=false;S.pairSafety="";
  toast(msg||"Couldn’t reach the live relay — running in solo mode.");render();
}
function leaveLive(){
  stopHeartbeat();
  try{if(S.mq){S.mq.publish(pairBase()+"/x/"+S.pairSide,"",{retain:false,qos:0});S.mq.end(true);}}catch(e){}
  E2E.reset();
  S.mq=null;S.connected=false;S.partnerOnline=false;S.partnerStage=0;S.partnerSeen=0;
  S.partnerDebrief={};S.pairSecure=false;S.pairSafety="";S.partnerChipMismatch=false;
}

/* ============================================================
   EXTERNAL LINKS — Capacitor Browser.open with window.open
   fallback, so links really open in the system browser instead of
   dead-navigating inside the native WKWebView. (Same openSite()
   pattern used in Permission / the App Builder Template.)
   Slow Burn is co-created, so BOTH creators' sites live here.
   ============================================================ */
const LINK_JESSICA="https://www.jessicaleighbiles.com";
const LINK_JONATHAN="https://jonathanscribbles.com";
function capNative(){ try{ return !!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()); }catch(e){ return false; } }
function capPlugin(name){ try{ return (window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins[name])||null; }catch(e){ return null; } }
function openSite(url){
  if(!url) return;
  const B=capPlugin("Browser");
  if(capNative()&&B){
    try{ Promise.resolve(B.open({url:url})).catch(function(){ window.open(url,"_system"); }); return; }catch(e){}
  }
  try{ window.open(url,"_system"); }
  catch(e){ try{ window.open(url,"_blank","noopener"); }catch(e2){ location.href=url; } }
}

/* ============================================================
   SUPPORT / TIP JAR — real StoreKit consumables via
   cordova-plugin-purchase (CdvPurchase v13), ported from the
   ScootSteps / ChordLoop IAP_PATTERN.

   MONETIZATION_ENABLED = true: the tip jar is LIVE. The three
   CONSUMABLE products below must exist in App Store Connect with
   EXACTLY these ids ($1.99 / $4.99 / $9.99), and the Paid Apps
   Agreement must show "Active" (ASC → Business).

   This is still not a dead-button risk (the Guideline 2.1(b)
   rejection that caught ChordLoop): the buttons render ONLY when
   Apple has actually returned purchasable products, so before the
   products go live the Support card falls back to the honest
   "share it / visit our sites" note instead of a buy button that
   would do nothing.

   NO MOCKS: a tip is recorded ONLY inside store.when().verified().
   tip() never grants anything — it only asks Apple, and it no-ops
   unless the native bridge is present AND Apple returned the
   product. So the buttons can never appear without a real,
   purchasable product behind them.

   Plugin arrival (IAP_PATTERN rule 3): CdvPurchase lands
   asynchronously, so we never gate setup on it at parse time —
   already-present OR deviceready OR a short poll, whichever wins,
   and wireStore() is idempotent so a double-arrival can't
   double-register or double-initialize the store.
   ============================================================ */
const Monetize=(function(){
  const TIP_KEY="sb_supported";
  const TIPS={
    small: "com.jonathanbiles.slowburn.tip.small",
    medium:"com.jonathanbiles.slowburn.tip.medium",
    large: "com.jonathanbiles.slowburn.tip.large"
  };
  const PRO_ID="com.jonathanbiles.slowburn.pro";
  const LABEL={small:"Small",medium:"Medium",large:"Generous"};
  const st={ready:false,wired:false,prices:{},proPrice:"",store:null,P:null,
            initError:null,missingHooks:[],lastError:null};

  /* RULE 1: native is decided from window.Capacitor, which the webview injects
     BEFORE any page script runs — never from CdvPurchase/cordova, which arrive
     asynchronously and would make this return false at parse time. */
  function native(){
    try{ if(window.Capacitor&&typeof window.Capacitor.isNativePlatform==="function")
           return !!window.Capacitor.isNativePlatform();
         return !!(window.Capacitor&&window.Capacitor.platform&&window.Capacitor.platform!=="web");
    }catch(e){ return false; }
  }
  function say(m){ if(typeof toast==="function") toast(m); }
  function paint(){ if(typeof render==="function") render(); }

  function ready(){ return !!st.ready; }
  function tipsReady(){ return !!(st.ready&&Object.keys(st.prices).length); }
  function proReady(){ return !!(st.ready&&st.proPrice); }
  function proPrice(){ return st.proPrice||""; }
  function hasSupported(){ try{ return localStorage.getItem(TIP_KEY)==="1"; }catch(e){ return false; } }
  function priceOf(k){ return st.prices[k]||""; }
  function keys(){ return ["small","medium","large"].filter(k=>st.prices[k]); }
  function labelOf(k){ return LABEL[k]||k; }

  /* Reads the StoreKit receipt rather than any local flag. */
  function ownsPro(){
    try{ return !!(st.store&&st.store.owned({id:PRO_ID,platform:st.P.Platform.APPLE_APPSTORE})); }
    catch(e){ try{ return !!(st.store&&st.store.owned(PRO_ID)); }catch(e2){ return false; } }
  }
  /* The ONLY place Pro is ever switched on. Idempotent: receipt hooks re-fire
     on every launch, so an owner must not be re-toasted each cold start. */
  function grantPro(how){
    const fresh=Pro.grant();
    if(!fresh) return false;
    paint();
    say(how==="restore"?"Slow Burn Pro restored — welcome back.":"Slow Burn Pro unlocked. Thank you.");
    return true;
  }
  function recordTip(){
    try{ localStorage.setItem(TIP_KEY,"1"); }catch(e){}
    paint(); say("Thank you — that genuinely helps.");
  }

  /* RULE 5: a hook that does not exist in this plugin version must not throw
     and abort initialize(). v13.18.0 has NO when().owned() — it is commented
     out in the plugin source — and calling it is exactly what stopped StoreKit
     from ever starting in ChordLoop. Degrade, record, carry on. */
  function listen(store,name,fn){
    try{
      const w=store.when();
      if(w&&typeof w[name]==="function"){ w[name](fn); return true; }
      st.missingHooks.push(name);
    }catch(e){ st.missingHooks.push(name); }
    return false;
  }

  function refreshPrices(){
    if(!st.store||!st.P) return;
    const AP=st.P.Platform.APPLE_APPSTORE;
    Object.keys(TIPS).forEach(k=>{
      const p=st.store.get(TIPS[k],AP);
      if(p&&p.pricing&&p.pricing.price) st.prices[k]=p.pricing.price;
    });
    /* Price comes from Apple, live. Nothing about the price is hardcoded — the
       tier is whatever Jonathan sets in App Store Connect. */
    const pro=st.store.get(PRO_ID,AP);
    if(pro&&pro.pricing&&pro.pricing.price) st.proPrice=pro.pricing.price;
  }

  function wireStore(){
    if(st.wired) return;                       // deviceready + poll can both fire
    const Plug=window.CdvPurchase; if(!Plug) return;
    st.wired=true;
    st.P=Plug; st.store=Plug.store;
    const store=st.store, AP=Plug.Platform.APPLE_APPSTORE;
    try{
      store.register(
        Object.keys(TIPS).map(k=>({id:TIPS[k],type:Plug.ProductType.CONSUMABLE,platform:AP}))
        .concat([{id:PRO_ID,type:Plug.ProductType.NON_CONSUMABLE,platform:AP}])
      );
      /* Each hook gets its OWN function object — Callbacks.push() throws
         "REGISTERING THE SAME CALLBACK TWICE" on a repeated reference. */
      listen(store,"approved",function(t){ try{ t.verify(); }catch(e){} });
      listen(store,"verified",function(r){
        try{ r.finish(); }catch(e){}
        /* A verified receipt is the grant point for both kinds of product. */
        if(ownsPro()) grantPro("purchase");
        else recordTip();
      });
      listen(store,"receiptUpdated",function(){ if(ownsPro()) grantPro("restore"); });
      listen(store,"receiptsReady", function(){ if(ownsPro()) grantPro("restore"); });
      listen(store,"productUpdated",function(){
        refreshPrices();
        if(ownsPro()) grantPro("restore");
        paint();
      });
      try{ store.error(function(err){
        if(err&&err.code===st.P.ErrorCode.PAYMENT_CANCELLED) return;   // user tapped Cancel
        st.lastError=err&&(err.message||err.code);
        console.warn("[iap] store error",err&&err.code,err&&err.message);
      }); }catch(e){}
    }catch(e){
      /* Even a broken registration must not stop initialize() being reached. */
      st.initError="setup: "+(e&&e.message||e);
    }
    /* RULE 5: unconditionally reachable. */
    try{
      Promise.resolve(store.initialize([AP])).then(function(errs){
        st.ready=true;
        if(errs&&errs.length) st.initError=(errs[0]&&(errs[0].message||errs[0].code))||"store unavailable";
        refreshPrices();
        if(ownsPro()) grantPro("restore");
        paint();
      }).catch(function(e){ st.initError="init: "+(e&&e.message||e); });
    }catch(e){ st.initError="init: "+(e&&e.message||e); }
  }

  function init(){
    /* RULE 3: already-present OR deviceready OR a short poll — any single
       mechanism can be missed on a cold launch. */
    try{ document.addEventListener("deviceready",wireStore,false); }catch(e){}
    wireStore();
    let tries=0;
    const t=setInterval(function(){
      if(st.wired||++tries>50){ clearInterval(t); return; }
      wireStore();
    },200);
  }

  /* RULE 4: never fail silently. Every path either opens the StoreKit sheet or
     says why it cannot. A purchase button that does nothing is the 2.1(b) bug. */
  function buyPro(){
    if(Pro.active()){ say("You already have Slow Burn Pro."); return false; }
    if(!native()){ say("Purchases are only available in the App Store version of Slow Burn."); return false; }
    if(!window.CdvPurchase){ say("The App Store isn’t connected yet. Give it a moment and try again."); wireStore(); return false; }
    if(!st.ready){ say(st.initError?("Couldn’t reach the App Store ("+st.initError+"). Please try again."):"Still connecting to the App Store — one moment."); return false; }
    if(ownsPro()){ grantPro("restore"); return true; }
    const p=st.store.get(PRO_ID,st.P.Platform.APPLE_APPSTORE);
    const offer=p&&p.getOffer&&p.getOffer();
    if(!offer){
      say("Couldn’t load Slow Burn Pro from the App Store. Check your connection and try again.");
      try{ st.store.update(); }catch(e){}
      return false;
    }
    try{ st.store.order(offer); return true; }
    catch(e){ say("Couldn’t start the purchase — please try again."); return false; }
  }

  /* Apple requires a working restore for non-consumables, and tests it. */
  function restorePro(){
    if(!native()){ say("Restoring only works in the App Store version of Slow Burn."); return false; }
    if(!st.ready){ say("Still connecting to the App Store — one moment."); return false; }
    say("Checking for a previous purchase…");
    try{
      Promise.resolve(st.store.restorePurchases()).then(function(err){
        if(err){ say("Couldn’t restore: "+((err&&err.message)||"please try again.")); return; }
        /* restorePurchases resolves before the receipt hooks land. */
        setTimeout(function(){
          if(Pro.active()||ownsPro()){ if(!grantPro("restore")) say("Slow Burn Pro is already active on this phone."); }
          else say("No previous Slow Burn Pro purchase found on this Apple ID.");
        },600);
      }).catch(function(){ say("Couldn’t restore — please try again."); });
    }catch(e){ say("Couldn’t restore — please try again."); return false; }
    return true;
  }

  function tip(k){
    if(!native()){ say("Tipping is only available in the App Store version."); return false; }
    if(!tipsReady()){ say("Still connecting to the App Store — one moment."); return false; }
    const p=st.store.get(TIPS[k],st.P.Platform.APPLE_APPSTORE);
    const offer=p&&p.getOffer&&p.getOffer();
    if(!offer){ say("Couldn’t load that tip from the App Store. Please try again."); return false; }
    try{ offer.order(); return true; }catch(e){ say("Couldn’t start the purchase — please try again."); return false; }
  }

  /* Safari Web Inspector: SlowBurnIAP.diagnose() when something is off. */
  function diagnose(){
    return {native:native(),ready:st.ready,pluginPresent:!!window.CdvPurchase,
            proLoaded:!!st.proPrice,proPrice:st.proPrice,ownsPro:ownsPro(),
            proPersisted:Pro.active(),tipPrices:st.prices,
            initError:st.initError,lastError:st.lastError,missingHooks:st.missingHooks};
  }

  return {native,ready,tipsReady,proReady,proPrice,hasSupported,priceOf,keys,labelOf,
          tip,buyPro,restorePro,init,diagnose,ownsPro,TIPS,PRO_ID};
})();

function cap1(s){ return s?s.charAt(0).toUpperCase()+s.slice(1):s; }

/* The human-checkable half of the handshake. Two phones that derived the
   same key show the same word; anyone sitting in the middle would have to
   produce two different keys, and the words would differ. Shown only once
   the key is confirmed, so it can never suggest more safety than exists. */
function safetyWordCard(){
  if(S.mode!=="live") return "";
  if(!S.pairSecure){
    return `<div class="card-soft mt14"><div style="font-weight:700;font-size:13.5px;margin-bottom:6px">Setting up encryption…</div>
      <p class="tiny" style="line-height:1.6">${TE("Your phones are agreeing on a key only the two of them will hold. Nothing is sent until that’s done.")}</p></div>`;
  }
  return `<div class="card-soft mt14" style="background:var(--sage-bg);border-color:#D5E2D0">
    <div style="display:flex;align-items:center;gap:9px"><div style="flex:none">${I.lock}</div>
      <div style="font-weight:700;font-size:13.5px">Encrypted link · safety word</div></div>
    <div class="codepill mt10" style="font-size:21px;color:#3f5c3a">${esc(S.pairSafety)}</div>
    <p class="tiny mt6" style="line-height:1.6">${TE("If this reads the same on {partner}’s phone, no one is in the middle. You only need to check it once, and only if you want to.")}</p></div>`;
}

function tabCheckins(){
  /* Your own reflections over time — the view whenever there is nothing to
     match against: solo (no partner), or live pairing before the encrypted
     handshake has been confirmed. */
  if(!canMatch()){
    let own="";
    for(let s=6;s>=1;s--){
      const d=me().debrief[s]; if(!d) continue;
      own+=`<div class="card mt14">
        <div style="display:flex;justify-content:space-between;align-items:center"><div class="st-title" style="font-size:15px">Stage ${s} · ${esc(stTitle(STAGES[s-1]))}</div><span class="badge done">Logged</span></div>
        <div class="divider" style="margin:14px 0"></div>
        <div class="tiny" style="font-weight:700;color:var(--sage);letter-spacing:.04em;text-transform:uppercase">What felt good</div>
        ${d.good.length?`<div class="chips mt10">${d.good.map(x=>`<span class="chip match readonly">${esc(x)}</span>`).join("")}</div>`:`<p class="tiny mt10">Nothing selected for this one.</p>`}
        ${d.more.length?`<div class="tiny mt18" style="font-weight:700;color:var(--plum);letter-spacing:.04em;text-transform:uppercase">You’d welcome more of</div><div class="chips mt10">${d.more.map(x=>`<span class="chip readonly" style="border-color:#F1C9E0;background:#FFF0F7;color:var(--plum-d)">${esc(x)}</span>`).join("")}</div>`:""}
      </div>`;
    }
    return `<div class="view"><div class="pad-tab">
      <div class="eyebrow">Your reflections</div><h2 class="display" style="font-size:25px;margin-top:8px">What you noticed</h2>
      <p class="lead mt6" style="font-size:13.5px">After each session you reflect privately. Your written note stays on this device and is never sent anywhere.</p>
      ${S.mode==="live"?`<div class="card-soft mt14"><p class="tiny" style="line-height:1.6">${TE("Your two phones haven’t finished setting up their encrypted link yet, so there’s nothing to compare. Once it’s live, the chips you both chose are matched privately between your phones — and your written note still never leaves this one.")}</p></div>`:""}
      ${own||`<div class="card mt18 center" style="padding:34px 20px"><div style="opacity:.5;margin-bottom:12px">${I.heart.replace(/currentColor/g,'#B85C41')}</div>

        <p class="tiny mt6">Run a session and reflect — your pattern over time shows up here.</p></div>`}
    </div></div>`;
  }
  let blocks="";
  for(let s=6;s>=1;s--){
    const mt=matchFor(s);
    if(mt){
      const gm=mt.good,mm=mt.more;
      blocks+=`<div class="card mt14">
        <div style="display:flex;justify-content:space-between;align-items:center"><div class="st-title" style="font-size:15px">Stage ${s} · ${esc(stTitle(STAGES[s-1]))}</div><span class="badge done">Matched</span></div>
        <div class="divider" style="margin:14px 0"></div>
        <div class="tiny" style="font-weight:700;color:var(--sage);letter-spacing:.04em;text-transform:uppercase">You both appreciated</div>
        ${gm.length?`<div class="chips mt10">${gm.map(x=>`<span class="chip match readonly">${esc(x)}</span>`).join("")}</div>`:`<p class="tiny mt10">No exact overlaps here — and that’s completely normal. Your private notes stayed private.</p>`}
        ${mm.length?`<div class="tiny mt18" style="font-weight:700;color:var(--plum);letter-spacing:.04em;text-transform:uppercase">You’re both open to</div><div class="chips mt10">${mm.map(x=>`<span class="chip readonly" style="border-color:#F1C9E0;background:#FFF0F7;color:var(--plum-d)">${esc(x)}</span>`).join("")}</div>`:""}
      </div>`;
    }
  }
  let pending="";
  for(let s=6;s>=1;s--){
    const mine=myDebrief(s),theirs=theirDebrief(s);
    if(mine&&!theirs){
      pending+=`<div class="card-soft mt14" style="display:flex;gap:12px;align-items:flex-start"><div style="flex:none">${I.chat.replace(/currentColor/g,'#8B7B76')}</div>

        <p class="tiny" style="margin-top:3px;line-height:1.5">${TE("Your Stage "+s+" reflection is saved. We’ll surface what you both felt good about once {partner} reflects too — and your private note never is.")}</p></div></div>`;
    }
  }
  const empty=(!blocks&&!pending);
  const live=S.mode==="live";
  const mismatch=live&&S.partnerChipMismatch
    ? `<div class="card-soft mt14"><p class="tiny" style="line-height:1.6">${TE("{Partner}’s copy of Slow Burn is a different version, so the app won’t try to line your answers up — comparing them could put the wrong words in {their} mouth. Update both phones and they’ll match again.")}</p></div>`
    : "";
  return `<div class="view"><div class="pad-tab">
    <div class="eyebrow">Shared reflections</div><h2 class="display" style="font-size:25px;margin-top:8px">What you both felt</h2>
    <p class="lead mt6" style="font-size:13.5px">After each session you each reflect privately. Slow Burn only surfaces what <b>both</b> of you named — never the rest.</p>
    ${live?`<div class="card-soft mt14" style="display:flex;gap:11px;align-items:flex-start">
      <div style="flex:none;margin-top:1px">${I.lock}</div>
      <div><div style="font-weight:700;font-size:13px">End-to-end encrypted</div>
      <p class="tiny" style="margin-top:3px;line-height:1.55">${TE("Your chip selections travel between your two phones scrambled with a key only your phones hold — the relay in the middle can’t read them. Your written note isn’t sent at all.")}${S.pairSafety?` Safety word: <b>${esc(S.pairSafety)}</b> — it should read the same on ${TE("{partner}")}’s phone.`:""}</p></div></div>`:""}
    ${mismatch}
    ${empty?`<div class="card mt18 center" style="padding:34px 20px"><div style="opacity:.5;margin-bottom:12px">${I.heart.replace(/currentColor/g,'#B85C41')}</div>
      <p class="lead" style="font-size:14px">No shared reflections yet.</p>
      <p class="tiny mt6">Run a session and reflect. ${live?TE("When {partner} reflects too, your overlap appears here."):TE("Then switch to {partner} and reflect — the overlap appears here.")}</p></div>`:(blocks+pending)}
  </div></div>`;
}
