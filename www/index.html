function screenStage(id){
  const st=STAGES[id-1],cur=maxUnlocked(),isCurrent=id===cur,solo=isSolo();
  const mySess=me().sessions[id]||0,iReady=!!me().ready[id],theyReady=partnerReadyFor(id);
  const unlockedNext=solo?iReady:(iReady&&theyReady);
  let gate="";
  if(id<6&&solo){

       a lock waiting on a partner who doesn't exist. */
    if(iReady){
      gate=`<div class="gate mt18" style="background:linear-gradient(160deg,#EEF3EA,#E4EEDF);border-color:#CFE0C9">

      gate=`<div class="gate mt18"><div class="g-icon">${I.lock}</div>

    } else if(isCurrent){
      gate=`<div class="gate mt18"><div class="g-icon">${I.spark}</div>
        <div style="font-weight:700;font-size:15px;font-family:var(--serif)">Ready to progress?</div>

      gate=`<div class="gate mt18" style="background:linear-gradient(160deg,#EEF3EA,#E4EEDF);border-color:#CFE0C9">
        <div class="g-icon">${I.check.replace(/#fff/g,'#6E8B6E')}</div>

        <div style="font-weight:700;font-size:15px;font-family:var(--serif)">The next stage is gated — together</div>
        <p class="tiny mt6" style="line-height:1.6">${TE("Run at least one session here first. When you’re ready, you’ll privately confirm — and Stage "+(id+1)+" unlocks only once {partner} does too.")}</p></div>`;
    } else if(isCurrent&&iReady&&!theyReady){
      gate=`<div class="gate mt18"><div class="g-icon">${I.shield}</div>
        <div style="font-weight:700;font-size:15px;font-family:var(--serif)">You’re ready.</div>
        <p class="tiny mt6" style="line-height:1.6">${TE("Stage "+(id+1)+" will unlock the moment {partner} is ready too. No rush — you’ll both simply arrive there.")}</p>
        <div class="status-line"><span class="s-dot on"></span>${esc(cap1(meName()))} · ready</div>
        <div class="status-line"><span class="s-dot off"></span>${esc(cap1(otherName()))} · hasn’t confirmed yet</div>
        <button class="btn btn-soft mt10" data-action="unready" data-id="${id}" style="font-size:13.5px">Actually, I’d like more time here</button></div>`;

      gate=`<div class="gate mt18"><div class="g-icon">${I.spark}</div>

      <div class="tiny" style="font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">In Slow Burn Pro</div>
      ${locked.map(p=>card(p,true)).join("")}
      <button class="btn btn-soft mt14" data-action="open-pro" style="font-size:13.5px">See what's in Pro</button>`:""}
  </div></div>`;
}
function screenPractice(id){
  const p=PRACTICES.find(x=>x.id===id);
  if(!p||(p.pro&&!Pro.active())) return screenPractices();
  const steps=(isSolo()&&p.soloSteps)||p.steps;
  return `<div class="view"><div class="pad">
    <button class="back" data-action="open-practices">‹ Practices</button>
    <div class="eyebrow mt10">Practice · ${esc(p.mins)}</div>
    <h2 class="display" style="font-size:26px;margin-top:8px">${esc(p.title)}</h2>
    <p class="lead mt6">${esc(p.blurb)}</p>
    <div class="card mt18">${steps.map((x,i)=>`<div class="step"><div class="dot">${i+1}</div><div class="stx">${esc(T(x))}</div></div>`).join("")}</div>
    <div class="foot-legal">A practice is not a stage — it doesn't move the consent gate, and you can run it as often as you like.</div>
  </div></div>`;
}

function screenSession(){
  const st=STAGES[S.session.stageId-1];
  if(S.session.phase==="guide"){
    return `<div class="view"><div class="pad">
      <button class="back" data-action="open-stage" data-id="${S.session.stageId}">‹ Leave session</button>
      <div class="center mt18"><div class="eyebrow">Stage ${st.id} · in session</div>
        <div class="timer mt10" id="timer">00:00</div><p class="tiny">Take all the time you want. There’s no target.</p></div>
      <div class="card mt18"><div style="font-family:var(--serif);font-size:16px;text-align:center;color:var(--plum)">“${esc(st.focus)}”</div>
        <div class="divider"></div>${stSteps(st).map((x,i)=>`<div class="step"><div class="dot">${i+1}</div><div class="stx">${esc(x)}</div></div>`).join("")}</div>
      <button class="btn btn-plum mt18" data-action="to-reflect">I’ve finished — reflect privately</button>
      <div class="foot-legal">${isSolo()?"You can pause or stop at any point, no reason needed.":"Either of you can pause or stop at any point, no explanation needed."}</div></div></div>`;
  }
  const g=S.form.good,m=S.form.more,solo=isSolo();
  return `<div class="view"><div class="pad">
    <div class="eyebrow">Private reflection · Stage ${st.id}</div>
    <h2 class="display" style="font-size:24px;margin-top:8px">Just for you${meName()==="you"?"":", "+esc(cap1(meName()))}</h2>
    <p class="lead mt6" style="font-size:13.5px">${
      S.mode==="shared"
      ?TE("Answer honestly. On this shared phone, only the things you and {partner} <b>both</b> choose are ever shown back — never the rest.")
      :canMatch()
      ?TE("Answer honestly. Your chip selections go to {partner}’s phone end-to-end encrypted, and only the ones you <b>both</b> choose are ever shown back — never the rest. Your note below is never sent.")
      :"Answer honestly. Nothing here leaves this device."}</p>
    <div class="card mt18"><div style="font-weight:700;font-size:14.5px">1 · What felt good this time?</div><div class="tiny mt6">Choose any that fit.</div>
      ${deckChipsHtml("good",g)}</div>
    <div class="card mt14"><div style="font-weight:700;font-size:14.5px">2 · Anything you'd welcome more of?</div><div class="tiny mt6">Gentle wishes, not complaints.</div>
      ${deckChipsHtml("more",m)}</div>
    ${lockedDecksCard()}
    <div class="card mt14"><div style="font-weight:700;font-size:14.5px">3 · A private note to yourself</div><div class="tiny mt6">${solo?"Only ever yours.":TE("Never shared with {partner} — this is only ever yours.")}</div>
      <textarea class="note mt10" id="privnote" placeholder="Anything you noticed, felt, or want to remember…">${esc(S.form.note)}</textarea>
      <div class="lock-note">${I.lock} Stays on your phone, always.</div></div>
    <button class="btn mt18" data-action="submit-debrief" data-id="${st.id}">Save my reflection</button>
    <div class="foot-legal">You can update your reflection any time before your next session.</div></div></div>`;
}

function nudgeText(cur){
  const st=STAGES[cur-1],mine=me().sessions[cur]||0,title=esc(stTitle(st));
  if(isSolo()){
    if(mine===0) return `You’re on <b>${title}</b>. Next time you have a quiet hour, open the stage and try a first session — there’s nothing to get right.`;
    if(me().ready[cur]) return `You’ve confirmed you’re ready for the next stage. Move on whenever you like — or stay here a while longer.`;
    return `Nicely done staying with <b>${title}</b>. Repeating a stage is not falling behind — it’s the point. Reflect after your next session to see your pattern.`;
  }
  if(mine===0) return T(`You’re on <b>${title}</b>. When {us} have a quiet evening, open the stage and try a first session — there’s nothing to get right.`);
  if(me().ready[cur]&&!partnerReadyFor(cur)) return T(`You’ve confirmed you’re ready for the next stage. {Partner} will get there in {their} own time — you’ll unlock it together.`);
  return `Nicely done staying with <b>${title}</b>. Repeating a stage is not falling behind — it’s the point. Reflect after your next session${canMatch()?" to see what you share":" — your own pattern builds up over time"}.`;
}

/* ---------------- FIND A CLINICIAN ---------------- */
function clinCard(name,tag,desc,url){
  return `<a class="opt" href="${url}" data-action="open-url" data-url="${url}" style="text-decoration:none;color:inherit">
    <div class="oic">${I.shield}</div>
    <div style="flex:1;min-width:0"><div class="ttl">${name}</div>
      <div class="tiny" style="color:var(--primary);font-weight:700;margin:2px 0">${tag}</div>
      <div class="dsc">${desc}</div></div>
    <div style="flex:none;color:var(--muted-2);font-size:18px">↗</div></a>`;
}
function screenClinicians(){
  return `<div class="view"><div class="pad">
    <button class="back" data-action="clin-back">‹ Back</button>
    <div class="eyebrow mt10">Professional support</div>
    <h2 class="display" style="font-size:25px;margin-top:8px">Find a clinician</h2>
    <p class="lead mt6" style="font-size:13.5px">Slow Burn works best alongside professional care — especially if there’s pain, a medical condition, recovery, or a trauma history. These are independent directories; we’re not affiliated with them.</p>
    <div class="mt18" style="display:flex;flex-direction:column;gap:12px">
      ${clinCard("AASECT","Certified sex therapists","Search AASECT-certified sex therapists &amp; counselors by location.","https://www.aasect.org/referral-directory")}
      ${clinCard("APTA Pelvic Health","Pelvic-floor physical therapists","Find a licensed pelvic-floor PT — pain, postpartum, post-surgery, menopause.","https://www.aptapelvichealth.org/ptlocator")}
      ${clinCard("Psychology Today","Sex therapy directory","Browse therapists who list sex therapy, filter by insurance &amp; area.","https://www.psychologytoday.com/us/therapists/sex-therapy")}
    </div>
    <div class="callout mt18" style="background:#FFF0F7;border-color:#F3D2E6;color:var(--plum-d)">If you’re in crisis or in severe pain, contact a licensed medical professional or your local emergency number directly.</div>
    <div class="foot-legal">Links open in your browser. Slow Burn is a wellness &amp; education program and does not provide medical care.</div>
  </div></div>`;
}

/* ============================================================ RENDER ============================================================ */
function renderBar(){
  const bar=document.getElementById("protobar");
  const pre=(S.screen==="welcome"||S.screen==="disclaimer"||S.screen==="setup"||S.screen==="pairing"||S.screen==="clinicians"
    ||S.screen==="pro"||S.screen==="journal"||S.screen==="practices"||S.screen==="practice");
  if(pre){bar.style.display="none";return;}
  bar.style.display="";
  if(S.mode==="live"){
    bar.innerHTML=`<div class="pb-title"><span class="pb-dot ${S.partnerOnline?'live':'off'}"></span>
      LIVE${S.pairSecure?" 🔒":""} · you’re ${esc(cap1(meName()))}
      <span class="pb-sub">· ${esc(S.partnerOnline?cap1(otherName())+' connected':T('waiting for {partner}'))}${S.pairSecure?" · encrypted":""} · code ${esc(prettyCode(S.code))}</span></div>
      <div class="pb-controls"><button class="btn-ghost-lite" data-action="leave">Leave</button></div>`;
  } else if(S.mode==="shared"){
    const nameA=cap1(firstName(person("A").name)||"You"), nameB=cap1(firstName(person("B").name)||cap1(partnerTerm()));
    bar.innerHTML=`<div class="pb-title"><span class="pb-dot"></span>${S.isSample?"Sample walkthrough":"Sharing one device"}<span class="pb-sub">· hand it over to switch sides</span></div>
      <div class="pb-controls"><span class="view-label">Seeing as</span>
        <div class="seg"><button data-action="set-view" data-view="A" class="${S.view==='A'?'on':''}"><span class="who-dot"></span>${esc(nameA)}</button>
        <button data-action="set-view" data-view="B" class="${S.view==='B'?'on':''}"><span class="who-dot"></span>${esc(nameB)}</button></div>
        <button class="btn-ghost-lite" data-action="reset">Reset</button></div>`;
  } else if(S.mode==="solo"){
    bar.innerHTML=`<div class="pb-title"><span class="pb-dot"></span>Slow Burn — solo practice<span class="pb-sub">· everything stays on this device</span></div>
      <div class="pb-controls"><button class="btn-ghost-lite" data-action="reset">Reset</button></div>`;
  } else {
    bar.innerHTML=`<div class="pb-title"><span class="pb-dot"></span>Slow Burn<span class="pb-sub">· guided intimacy program</span></div>`;
  }
}
function render(){
  renderBar();
  const root=document.getElementById("root");
  let html="";
  if(S.screen==="welcome")html=screenWelcome();
  else if(S.screen==="disclaimer")html=screenDisclaimer();
  else if(S.screen==="setup")html=screenSetup();
  else if(S.screen==="profile")html=screenProfile();
  else if(S.screen==="pairing")html=S.scanning?screenScan():screenPairing();
  else if(S.screen==="stage")html=appChrome(screenStage(S.stageOpen));
  else if(S.screen==="session")html=screenSession();
  else if(S.screen==="clinicians")html=screenClinicians();
  else if(S.screen==="pro")html=screenPro();
  else if(S.screen==="journal")html=screenJournal();
  else if(S.screen==="practices")html=screenPractices();
  else if(S.screen==="practice")html=screenPractice(S.practiceOpen);
  else if(S.screen==="app"){
    let inner=S.tab==="today"?tabToday():S.tab==="program"?tabProgram():S.tab==="checkins"?tabCheckins():tabPartner();
    html=appChrome(inner);
  }
  root.innerHTML=html;root.scrollTop=0;
  if(S.screen==="pairing"&&S.pairPhase==="create")drawQR();
}
/* The QR carries the PAIR CODE and nothing else — no URL, no origin. It used
   to encode location.origin + "?pair=…", which inside the native app is
   capacitor://localhost/?pair=… : a string no other phone can open. Scanning
   it did nothing. Now the app's own scanner reads this, and a system camera
   pointed at it simply shows the ten characters to type. */
function drawQR(){
  const box=document.getElementById("qrbox");if(!box)return;
  box.innerHTML="";
  try{
    if(window.QRCode){new QRCode(box,{text:S.code,width:172,height:172,colorDark:"#2B2126",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});return;}
  }catch(e){}
  box.innerHTML=`<div class="tiny center">Type this code on the other phone:<br/><b>${esc(prettyCode(S.code))}</b></div>`;
}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove("show"),2800);}

setInterval(()=>{
  if(S.screen==="session"&&S.session&&S.session.phase==="guide"){
    const el=document.getElementById("timer");
    if(el){const s=Math.floor((Date.now()-S.session.startedAt)/1000);
      el.textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}
  }
},1000);

/* ============================================================ EVENTS ============================================================ */
/* Setup re-renders on every pick, so pull any on-screen text fields into
   state first — otherwise a half-typed name or self-description is lost. */
function captureSetup(){
  const val=id=>{const el=document.getElementById(id);return el?el.value:null;};
  ["A","B"].forEach(r=>{
    const p=S.profile.people[r]; if(!p) return;
    const n=val("nm_"+r);  if(n!==null) p.name=n.trim();
    const g=val("gc_"+r);  if(g!==null) p.genderCustom=g.trim();
    const pc=val("pc_"+r); if(pc!==null) p.pronounsCustom=pc.trim();
    const o=val("oc_"+r);  if(o!==null) p.orientationCustom=o.trim();
  });
  const sc=val("sc");   if(sc!==null) S.profile.structureCustom=sc.trim();
  const pt=val("ptc");  if(pt!==null) S.profile.partnerTermCustom=pt.trim();
}
document.addEventListener("click",(e)=>{
  const el=e.target.closest("[data-action]");if(!el)return;
  const a=el.dataset.action;

  // external links — always through the system browser, never in-webview
  if(a==="open-url"){ e.preventDefault(); openSite(el.dataset.url); return; }
  // tip: asks Apple only. Never grants — that happens in Monetize's verified().
  if(a==="tip"){ e.preventDefault(); if(!Monetize.tip(el.dataset.tier)) toast("Tipping isn't available right now."); return; }

  if(a==="noop"){ return; }
  if(a==="go"){
    if(el.dataset.to==="setup"&&S.pending){ S.setupIntent="two"; S.setupStep="you"; }
    S.screen=el.dataset.to; render(); return;
  }
  if(a==="toggle-ack"){S.ack=!S.ack;render();return;}

  /* ---------- setup ---------- */
  if(a==="who-solo"){ S.setupIntent="solo"; S.setupStep="you"; render(); return; }
  if(a==="who-two"){ S.setupIntent="two"; S.setupStep="you"; render(); return; }
  if(a==="who-sample"){
    // Clearly-labelled example so a reviewer (or a curious user) can look
    // around without entering anything about themselves.
    S.isSample=true; S.mode="shared"; S.view="A";
    S.profile={done:true,
      people:{A:Object.assign(blankPerson(),SAMPLE.A),B:Object.assign(blankPerson(),SAMPLE.B)},
      structure:SAMPLE.structure,structureCustom:"",
      partnerTerm:SAMPLE.partnerTerm,partnerTermCustom:"",areas:SAMPLE.areas};
    S.screen="app"; S.tab="today"; render();
    toast("Sample walkthrough — nothing here is yours.");
    return;
  }
  if(a==="setup-save"){
    captureSetup(); S.editReturn=false; saveProfile();
    S.screen="profile"; render(); toast("Saved."); return;
  }
  if(a==="setup-back"){
    captureSetup();
    if(S.editReturn){ S.editReturn=false; S.screen="profile"; render(); return; }
    if(S.setupStep==="structure") S.setupStep=(S.setupIntent==="solo")?"you":"partner";
    else if(S.setupStep==="partner") S.setupStep="you";
    else if(S.setupStep==="you") S.setupStep="who";
    else { S.screen="disclaimer"; }
    render(); return;
  }
  if(a==="setup-next"){
    captureSetup();
    if(S.setupStep==="you") S.setupStep=(S.setupIntent==="solo")?"structure":"partner";
    else if(S.setupStep==="partner") S.setupStep="structure";
    render(); return;
  }
  if(a==="setup-done"){
    captureSetup();
    S.profile.done=true;
    if(S.setupIntent==="solo"){
      if(!S.profile.structure) S.profile.structure="solo";
      S.mode="solo"; S.view="A"; S.screen="app"; S.tab="today";
    } else {
      S.screen="pairing"; S.pairPhase=S.pending?"join":"choose";
    }
    saveProfile(); render(); return;
  }
  if(a==="pick"){
    captureSetup();
    const grp=el.dataset.grp,val=el.dataset.val,role=el.dataset.role;
    if(grp==="gender"||grp==="pronouns"||grp==="orientation"){
      const p=S.profile.people[role]; if(p) p[grp]=(p[grp]===val?"":val);
    } else if(grp==="pterm"){ S.profile.partnerTerm=val; }
    else if(grp==="structure"){ S.profile.structure=val; }
    else if(grp==="areas"){ S.profile.areas=val; }
    saveProfile(); render(); return;
  }

  /* ---------- profile (editable, from the last tab) ---------- */
  if(a==="open-profile"){ S.profileReturn={screen:S.screen,tab:S.tab}; S.screen="profile"; render(); return; }
  if(a==="profile-back"){ const r=S.profileReturn||{screen:"app",tab:"partner"}; S.screen=r.screen||"app"; S.tab=r.tab||"partner"; render(); return; }
  if(a==="edit-person"){ S.editReturn=true; S.setupIntent=isSolo()?"solo":"two"; S.setupStep=(el.dataset.role==="B")?"partner":"you"; S.screen="setup"; render(); return; }
  if(a==="edit-structure"){ S.editReturn=true; S.setupIntent=isSolo()?"solo":"two"; S.setupStep="structure"; S.screen="setup"; render(); return; }
  if(a==="reset-all"){
    /* Deliberately does NOT touch the Pro entitlement or the journal switch —
       a purchase is not app state, and silently revoking it would be theft. */
    leaveLive(); clearProfile(); S=freshState(); loadTheme(); loadJournal();
    render(); toast("Reset. Slow Burn starts fresh."); return;
  }
  /* ---------- Pro ---------- */
  if(a==="open-pro"){ S.proReturn={screen:S.screen,tab:S.tab,stageOpen:S.stageOpen,session:S.session}; S.screen="pro"; render(); return; }
  if(a==="pro-back"){
    const r=S.proReturn||{screen:"app",tab:"partner"};
    S.screen=r.screen||"app"; if(r.tab)S.tab=r.tab; if(r.stageOpen)S.stageOpen=r.stageOpen;
    if(S.screen==="session"&&!S.session) S.screen="app";
    render(); return;
  }
  /* Click-time routing: on native this ALWAYS goes to StoreKit. There is no
     other branch — no demo unlock exists anywhere in this app. */
  if(a==="pro-buy"){ Monetize.buyPro(); return; }
  if(a==="pro-restore"){ Monetize.restorePro(); return; }
  if(a==="set-theme"){
    const t=THEMES.find(x=>x.id===el.dataset.theme);
    if(t&&(!t.pro||Pro.active())) applyTheme(t.id);
    render(); return;
  }
  if(a==="toggle-journal"){
    if(!Pro.active()){ toast("The keepsake journal is part of Slow Burn Pro."); return; }
    const turningOff=S.journalOn;
    setJournalOn(!S.journalOn);
    render(); toast(turningOff?"Journal off — everything saved has been deleted.":"Journal on. It stays on this phone.");
    return;
  }
  if(a==="open-journal"){ if(Pro.active()&&S.journalOn){ S.screen="journal"; render(); } return; }
  if(a==="clear-journal"){ journalClear(); render(); toast("Journal deleted from this phone."); return; }
  if(a==="open-practices"){ S.screen="practices"; render(); return; }
  if(a==="open-practice"){ S.practiceOpen=el.dataset.id; S.screen="practice"; render(); return; }

  if(a==="find-clinician"){S.clinReturn={screen:S.screen,tab:S.tab,stageOpen:S.stageOpen};S.screen="clinicians";render();return;}
  if(a==="clin-back"){const r=S.clinReturn||{screen:"app",tab:"today"};S.screen=r.screen||"app";if(r.tab)S.tab=r.tab;if(r.stageOpen)S.stageOpen=r.stageOpen;render();return;}

  // pairing
  if(a==="pair-create"){S.pairPhase="create";S.code=genCode();connectLive("h","",S.code);render();return;}
  if(a==="pair-join"){S.pairPhase="join";S.scanError="";render();return;}
  if(a==="scan-open"){openScan();return;}
  if(a==="scan-cancel"){closeScan();return;}
  if(a==="pair-shared"){S.mode="shared";S.view="A";S.screen="app";S.tab="today";saveProfile();render();return;}
  if(a==="pair-to-setup"){Scanner.stop();S.scanning=false;leaveLive();S.mode=null;S.screen="setup";S.setupStep="structure";render();return;}
  if(a==="pair-back"){Scanner.stop();S.scanning=false;S.scanError="";leaveLive();S.mode=null;S.pairPhase="choose";render();return;}
  if(a==="enter-app-host"){
    const nm=(document.getElementById("myname")||{}).value||"";
    if(nm.trim())S.profile.people.A.name=nm.trim();
    saveProfile();S.screen="app";S.tab="today";render();return;
  }
  if(a==="do-join"){
    const code=normCode((document.getElementById("joincode")||{}).value||"");
    const nm=((document.getElementById("joinname")||{}).value||"").trim();
    if(code.length<CODE_LEN){toast("Enter the whole code from the other phone");return;}
    connectLive("g",nm,code);toast("Linking…");return;
  }
  if(a==="leave"||a==="reset"){
    leaveLive();
    const keep=(!S.isSample&&S.profile.done)?JSON.parse(JSON.stringify(S.profile)):null;
    S=freshState();
    if(keep){ S.profile=keep; S.screen="setup"; S.setupStep="who"; }   // keep who you are; re-choose how you're practising
    else { clearProfile(); }
    render(); return;
  }
  if(a==="set-view"){S.view=el.dataset.view;render();return;}

  // app
  if(a==="tab"){S.tab=el.dataset.tab;S.screen="app";render();return;}
  if(a==="open-stage"){S.stageOpen=+el.dataset.id;S.screen="stage";render();return;}
  if(a==="schedule"){S.nextSession="This weekend";render();toast("We’ll send a gentle reminder — never a demand.");return;}
  if(a==="start-session"){S.session={stageId:+el.dataset.id,startedAt:Date.now(),phase:"guide"};S.screen="session";render();return;}
  if(a==="to-reflect"){S.form={good:new Set(),more:new Set(),note:""};S.session.phase="reflect";render();return;}
  if(a==="chip"){const set=S.form[el.dataset.grp];const v=el.dataset.val;if(set.has(v))set.delete(v);else set.add(v);el.classList.toggle("sel");return;}
  if(a==="submit-debrief"){
    const id=+el.dataset.id;const note=(document.getElementById("privnote")||{}).value||"";
    me().debrief[id]={good:[...S.form.good],more:[...S.form.more],note};
    /* Pro + opt-in only. Writes to this phone and nowhere else. */
    journalAdd(id,[...S.form.good],[...S.form.more],note);
    me().sessions[id]=(me().sessions[id]||0)+1;
    S.session=null;S.screen="app";S.stageOpen=id;
    /* Live: the chip indexes go out inside the encrypted envelope. The note
       is stored above but stateEnvelope() never reads it. */
    publishState();
    if(!canMatch()){ S.tab="checkins"; render(); toast("Reflection saved — on this phone, just for you."); return; }
    const bothIn=!!matchFor(id);
    S.tab=bothIn?"checkins":"today";render();
    toast(bothIn?"Reflection saved — see what you both shared":T("Saved privately. {Partner} hasn’t reflected yet."));
    return;
  }
  if(a==="ready"){const id=+el.dataset.id;me().ready[id]=true;publishProgress();render();
    if(isSolo()){ toast("Confirmed — Stage "+(id+1)+" unlocked."); return; }
    const both=partnerReadyFor(id);
    toast(both?"You both confirmed — Stage "+(id+1)+" unlocked":T("Confirmed privately. Waiting for {partner}."));return;}
  if(a==="unready"){const id=+el.dataset.id;me().ready[id]=false;publishProgress();render();toast("No problem — staying here.");return;}
});

/* init: honor ?pair=CODE deep link for the joining partner */
(function init(){
  try{const p=new URL(location.href).searchParams.get("pair");if(p)S.pending=normCode(p);}catch(e){}
  // A returning user shouldn't have to re-declare who they are.
  if(loadProfile()&&!S.pending){
    S.ack=true;
    if(S.mode==="solo"||S.mode==="shared"){ S.screen="app"; S.tab="today"; }
    else { S.mode=null; S.screen="pairing"; S.pairPhase="choose"; }
  }
  loadTheme(); loadJournal();
  Monetize.init();
  render();
})();
</script>
